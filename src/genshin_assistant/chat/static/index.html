<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原神配队助手</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --text: #1f2328; --muted: #6b6f76; --line: #e3e1da;
  --accent: #3b6ea8; --accent-soft: #e7eef7; --user: #3b6ea8; --user-text: #fff; --warn: #9a6400;
  --pyro: #d9534f; --hydro: #3b82c4; --electro: #8e5bc4; --cryo: #4aa8c0; --anemo: #3fa58c; --geo: #b58a2a; --dendro: #6aa23a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17191c; --panel: #202327; --text: #e6e6e3; --muted: #9a9ea5; --line: #33373c;
    --accent: #7fa8d8; --accent-soft: #263443; --user: #34557c; --user-text: #f2f4f7; --warn: #e0b04c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
.app { display: grid; grid-template-columns: 1fr 320px; height: 100vh; }
main { display: flex; flex-direction: column; min-width: 0; }
header { padding: 12px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 12px; }
header h1 { font-size: 17px; margin: 0; }
header .meta { color: var(--muted); font-size: 13px; }
#roster-toggle { margin-left: auto; display: none; }
#log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 760px; padding: 10px 14px; border-radius: 10px; }
.msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); white-space: pre-wrap; }
.msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
.msg.bot p { margin: 0 0 8px; } .msg.bot p:last-child { margin-bottom: 0; }
.msg.bot ul, .msg.bot ol { margin: 4px 0 8px; padding-left: 22px; }
.msg.bot h3, .msg.bot h4 { margin: 10px 0 4px; font-size: 15px; }
.msg.err { border-color: var(--pyro); color: var(--pyro); }
.msg .tag { display: inline-block; font-size: 12px; color: var(--muted); margin-top: 6px; }
details { margin-top: 8px; font-size: 13px; color: var(--muted); }
details pre { white-space: pre-wrap; word-break: break-all; max-height: 360px; overflow: auto; background: var(--bg); padding: 8px; border-radius: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 16px; padding: 4px 12px; cursor: pointer; font: inherit; font-size: 13px; }
.chip:hover { border-color: var(--accent); }
form#ask { display: flex; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
textarea { flex: 1; resize: none; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); height: 44px; }
button.primary { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 0 18px; font: inherit; cursor: pointer; }
button.primary:disabled { opacity: .5; cursor: default; }
aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
aside h2 { font-size: 15px; margin: 0; padding: 12px 14px 4px; }
aside .hint { color: var(--muted); font-size: 12px; padding: 0 14px 8px; }
aside .bar { display: flex; gap: 6px; padding: 0 14px 8px; flex-wrap: wrap; }
aside input[type=search] { width: 100%; font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
#chars { overflow-y: auto; flex: 1; padding: 0 8px 12px; }
.el { font-size: 12px; color: var(--muted); padding: 8px 6px 2px; }
.row { display: flex; align-items: center; gap: 6px; padding: 2px 6px; border-radius: 6px; }
.row:hover { background: var(--bg); }
.row label { flex: 1; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.row .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.row .kb { font-size: 11px; color: var(--accent); }
.row select { font: inherit; font-size: 12px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
.small { font-size: 12px; padding: 3px 8px; }
#saved { font-size: 12px; color: var(--muted); padding: 0 14px 10px; min-height: 18px; }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  aside { display: none; position: fixed; inset: 0; z-index: 10; }
  aside.open { display: flex; }
  #roster-toggle { display: inline-block; }
  #log, form#ask { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<div class="app">
  <main>
    <header>
      <h1>原神配队助手</h1><span class="meta" id="meta"></span>
      <button class="chip" id="roster-toggle">我的角色</button>
    </header>
    <div id="log">
      <div class="msg bot">
        <p>问我某个角色怎么配队、怎么养成。没有的角色直接说，例如「我没有芙宁娜」。在「我的角色」里勾上你拥有的角色和命座，推荐会只用你有的人。</p>
        <div class="chips" id="examples"></div>
      </div>
    </div>
    <form id="ask">
      <textarea id="q" placeholder="例如：我有沃雅妮莎，怎么配队？（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="primary" id="send">发送</button>
    </form>
  </main>
  <aside id="roster">
    <h2>我的角色</h2>
    <div class="hint" id="mode-hint"></div>
    <div class="bar">
      <input type="search" id="filter" placeholder="搜角色">
    </div>
    <div class="bar">
      <button class="chip small" id="save">保存</button>
      <button class="chip small" id="clear">不限制（全都有）</button>
      <button class="chip small" id="close" style="display:none">关闭</button>
    </div>
    <div id="saved"></div>
    <div id="chars"></div>
  </aside>
</div>
<script>
const EL = {pyro: "火", hydro: "水", electro: "雷", cryo: "冰", anemo: "风", geo: "岩", dendro: "草"};
const EXAMPLES = ["我有沃雅妮莎，怎么配队？", "那维莱特 0 命怎么配队", "我没有芙宁娜和万叶，水龙怎么配", "阿罗夏 1 命怎么养成"];
const $ = s => document.querySelector(s);
let last = null, chars = [], owned = null, busy = false;

function esc(s) { return s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>"); }
// 够用的 Markdown：标题、列表、粗体、段落
function md(text) {
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of text.split("\n")) {
    const line = raw.trimEnd();
    let m;
    if ((m = line.match(/^#{1,4}\s+(.*)/))) { close(); out.push(`<h4>${inline(m[1])}</h4>`); }
    else if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); }
    else if ((m = line.match(/^\s*(\d+)[.、]\s+(.*)/))) { if (list !== "ol") { close(); out.push(`<ol start="${m[1]}">`); list = "ol"; } out.push(`<li>${inline(m[2])}</li>`); }
    else if (!line.trim()) { close(); }
    else { close(); out.push(`<p>${inline(line)}</p>`); }
  }
  close();
  return out.join("");
}

function add(cls, html) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.innerHTML = html;
  $("#log").appendChild(d); $("#log").scrollTop = $("#log").scrollHeight;
  return d;
}

async function ask(question) {
  if (busy || !question.trim()) return;
  busy = true; $("#send").disabled = true;
  add("user", esc(question));
  const pending = add("bot", "<p>思考中…</p>");
  try {
    const r = await fetch("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({question, last})});
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    last = data.query;
    const note = data.explained_by_llm ? "" : `<span class="tag">大模型解释失败，下面是引擎原始结果</span>`;
    pending.innerHTML = md(data.answer) + note +
      `<details><summary>引擎结果</summary><pre>${esc(JSON.stringify({query: data.query, facts: data.facts}, null, 1))}</pre></details>`;
    if (data.facts.status === "need_carry") {  // 问辅助：候选主C做成按钮，点一下就是回答
      const box = document.createElement("div"); box.className = "chips"; box.style.marginTop = "8px";
      for (const c of data.facts.candidates) {
        const b = document.createElement("button"); b.className = "chip"; b.type = "button"; b.textContent = "搭配" + c.zh;
        b.onclick = () => ask(b.textContent); box.appendChild(b);
      }
      pending.insertBefore(box, pending.querySelector("details"));
    }
  } catch (e) {
    pending.className = "msg bot err"; pending.textContent = "出错了：" + e.message;
  } finally {
    busy = false; $("#send").disabled = false; $("#log").scrollTop = $("#log").scrollHeight;
  }
}

function renderChars() {
  const f = $("#filter").value.trim();
  const box = $("#chars"); box.innerHTML = "";
  let group = null;
  for (const c of chars) {
    if (f && !c.zh.includes(f)) continue;
    const g = c.in_kb ? "已录入知识库" : (EL[c.element] || "其他");
    if (g !== group) { group = g; box.insertAdjacentHTML("beforeend", `<div class="el">${g}</div>`); }
    const have = owned ? c.zh in owned : false;
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<label><input type="checkbox" ${have ? "checked" : ""}><span class="dot" style="background:var(--${c.element})"></span>${esc(c.zh)}${c.rarity === 5 ? " ★" : ""}</label>` +
      `<select>${[0,1,2,3,4,5,6].map(n => `<option value="${n}">${n} 命</option>`).join("")}</select>`;
    const [cb, sel] = [row.querySelector("input"), row.querySelector("select")];
    sel.value = have ? owned[c.zh] : 0; sel.disabled = !have;
    cb.onchange = () => { owned = owned || {}; if (cb.checked) owned[c.zh] = +sel.value; else delete owned[c.zh]; sel.disabled = !cb.checked; dirty(); };
    sel.onchange = () => { if (owned && c.zh in owned) { owned[c.zh] = +sel.value; dirty(); } };
    box.appendChild(row);
  }
  hint();
}
function hint() {
  $("#mode-hint").textContent = owned === null
    ? "现在按「全都有、0 命」推荐。勾上你有的角色后保存，就只用你有的人。"
    : `已勾 ${Object.keys(owned).length} 个角色，推荐只用这些人（问到的角色当作有）。`;
}
function dirty() { $("#saved").textContent = "有改动，记得保存"; hint(); }
async function saveRoster(value) {
  await fetch("/api/roster", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({owned: value})});
  $("#saved").textContent = "已保存";
}

$("#ask").onsubmit = e => { e.preventDefault(); const q = $("#q").value; $("#q").value = ""; ask(q); };
$("#q").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#ask").requestSubmit(); } };
$("#filter").oninput = renderChars;
$("#save").onclick = () => saveRoster(owned);
$("#clear").onclick = () => { owned = null; renderChars(); saveRoster(null); };
$("#roster-toggle").onclick = () => { $("#roster").classList.add("open"); $("#close").style.display = ""; };
$("#close").onclick = () => $("#roster").classList.remove("open");
for (const q of EXAMPLES) {
  const b = document.createElement("button"); b.className = "chip"; b.type = "button"; b.textContent = q;
  b.onclick = () => ask(q); $("#examples").appendChild(b);
}
fetch("/api/state").then(r => r.json()).then(s => {
  chars = s.characters; owned = s.owned; $("#meta").textContent = s.model ? `模型 ${s.model}` : "";
  renderChars();
});
</script>
</body>
</html>
