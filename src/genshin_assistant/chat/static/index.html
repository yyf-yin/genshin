<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原神配队助手</title>
<style>
/* 配色取自游戏界面：夜空蓝底、金色描边、羊皮纸色文字和按钮 */
:root {
  --sky-1: #11131f; --sky-2: #1d2135; --sky-3: #2e3450;
  --gold: #d3bc8e; --gold-hi: #f0dca8; --gold-dim: rgba(211, 188, 142, .35);
  --paper: #ece5d8; --ink: #3b4255; --ink-soft: #6c7489;
  --text: #ece5d8; --muted: #a9a59c;
  --box: rgba(18, 20, 32, .78); --box-edge: rgba(211, 188, 142, .28);
  --opt: rgba(28, 31, 48, .82); --opt-hover: rgba(52, 57, 84, .92);
  --me-bg: #ece5d8; --me-fg: #3b4255;
  --err: #ff8f7a;
  --serif: "HYWenHei 85W", "HYWenHei", "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --sky-1: #d8cfbd; --sky-2: #e9e2d3; --sky-3: #f4efe4;
    --gold: #a6834a; --gold-hi: #8a6a35; --gold-dim: rgba(166, 131, 74, .35);
    --text: #3b4255; --muted: #7a7466;
    --box: rgba(250, 247, 240, .9); --box-edge: rgba(166, 131, 74, .35);
    --opt: rgba(250, 247, 240, .85); --opt-hover: #fffdf7;
    --me-bg: #4a5269; --me-fg: #f3eee3;
    --err: #b8432e;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--text); background: var(--sky-1);
  font: 15px/1.75 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
/* 夜空：渐变 + 几颗星 */
.sky {
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.7), transparent 60%),
    radial-gradient(1px 1px at 28% 62%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1.5px 1.5px at 47% 12%, rgba(255,240,200,.8), transparent 60%),
    radial-gradient(1px 1px at 66% 38%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1px 1px at 82% 22%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1.5px 1.5px at 90% 70%, rgba(255,240,200,.6), transparent 60%),
    radial-gradient(1px 1px at 8% 84%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(ellipse 80% 50% at 50% 0%, var(--sky-3), transparent 70%),
    linear-gradient(180deg, var(--sky-2), var(--sky-1));
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) .sky {
    background:
      radial-gradient(ellipse 70% 45% at 50% 0%, #fffaf0, transparent 70%),
      repeating-linear-gradient(45deg, rgba(166,131,74,.035) 0 2px, transparent 2px 14px),
      linear-gradient(180deg, var(--sky-3), var(--sky-1));
  }
}

.app { display: flex; flex-direction: column; height: 100vh; max-width: 880px; margin: 0 auto; padding: 0 16px; }

header { text-align: center; padding: 22px 0 10px; }
header h1 {
  margin: 0; font: 600 22px/1.3 var(--serif); letter-spacing: .18em; color: var(--gold-hi);
  display: flex; align-items: center; justify-content: center; gap: 14px;
}
header h1::before, header h1::after {
  content: ""; width: 72px; height: 1px; flex: none;
  background: linear-gradient(90deg, transparent, var(--gold));
}
header h1::after { transform: scaleX(-1); }
.diamond { width: 7px; height: 7px; background: var(--gold); transform: rotate(45deg); display: inline-block; flex: none; }
header .meta { color: var(--muted); font-size: 12px; margin-top: 2px; letter-spacing: .05em; }

#log { flex: 1; overflow-y: auto; padding: 12px 2px 20px; display: flex; flex-direction: column; gap: 18px; scrollbar-width: thin; scrollbar-color: var(--gold-dim) transparent; }

/* 派蒙的话：游戏里的对话框，上下金线向两边淡出 */
.npc { align-self: stretch; position: relative; padding: 14px 22px 16px; background: var(--box); border-radius: 4px;
  box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.npc::before, .npc::after { content: ""; position: absolute; left: 6%; right: 6%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--box-edge), var(--gold), var(--box-edge), transparent); }
.npc::before { top: 0; } .npc::after { bottom: 0; }
.npc .name { font: 600 15px/1 var(--serif); color: var(--gold); letter-spacing: .12em; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.npc .name .star { width: 14px; height: 14px; fill: var(--gold); }
.npc .body p { margin: 0 0 10px; } .npc .body p:last-child { margin-bottom: 0; }
.npc .body ul, .npc .body ol { margin: 4px 0 10px; padding-left: 22px; }
.npc .body h4 { margin: 12px 0 4px; font: 600 15px var(--serif); color: var(--gold-hi); }
.npc .body strong { color: var(--gold-hi); font-weight: 600; }
.npc .body > * { animation: reveal .45s ease both; }
@keyframes reveal { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.npc.err .body { color: var(--err); }
.npc .tag { display: block; font-size: 12px; color: var(--muted); margin-top: 8px; }
.npc details { margin-top: 10px; font-size: 12px; color: var(--muted); }
.npc details summary { cursor: pointer; width: fit-content; list-style: none; }
.npc details summary::before { content: "◇ "; color: var(--gold); }
.npc details[open] summary::before { content: "◆ "; }
.npc details pre { white-space: pre-wrap; word-break: break-all; max-height: 360px; overflow: auto; background: rgba(0,0,0,.18); padding: 8px 10px; border-radius: 4px; margin: 6px 0 0; }
/* 派蒙语音：名牌右边的喇叭，正在念的那段描金 */
.npc .say { margin-left: auto; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--gold-dim); background: transparent;
  display: grid; place-items: center; cursor: pointer; padding: 0; }
.npc .say svg { width: 15px; height: 15px; fill: var(--gold); }
.npc .say:hover, .npc .say:focus-visible { border-color: var(--gold); outline: none; box-shadow: 0 0 0 2px var(--gold-dim); }
.npc .say.on { background: var(--gold-dim); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--gold-dim); } }
.npc .body .speaking, .npc .body.speaking { color: var(--gold-hi); }
header .auto { margin-top: 6px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
header .auto input { accent-color: var(--gold); margin: 0; }
header .auto[hidden] { display: none; }
.dots { font-size: 22px; line-height: 1; color: var(--gold); letter-spacing: .15em; }
.dots span { display: inline-block; animation: blink 1.2s infinite both; }
.dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

/* 旅行者说的话：右侧的羊皮纸气泡 */
.me { align-self: flex-end; margin-top: 10px; max-width: 78%; background: var(--me-bg); color: var(--me-fg); padding: 8px 18px;
  border-radius: 20px; white-space: pre-wrap; box-shadow: 0 2px 10px rgba(0,0,0,.2); position: relative; }
.me::after { content: "旅行者"; position: absolute; right: 16px; top: -20px; font: 12px var(--serif); color: var(--muted); letter-spacing: .1em; }

/* 对话选项：游戏里右侧那一列可点的选项 */
.options { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; margin-top: 14px; }
.opt {
  display: flex; align-items: center; gap: 10px; width: min(360px, 100%);
  background: var(--opt); color: var(--text); border: 1px solid var(--gold-dim); border-radius: 22px;
  padding: 7px 20px 7px 10px; font: inherit; font-size: 14px; text-align: left; cursor: pointer;
  transition: background .15s, border-color .15s, box-shadow .15s;
}
.opt span:last-child { flex: 1; }
.opt:hover, .opt:focus-visible { background: var(--opt-hover); border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-dim); outline: none; }
.opt .icon { width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center; background: rgba(211,188,142,.15); }
.opt .icon svg { width: 13px; height: 13px; fill: var(--gold); }
.opt:disabled { opacity: .5; cursor: default; }

/* 输入区 */
form#ask { display: flex; gap: 10px; align-items: center; padding: 12px 0 18px; }
.field { flex: 1; display: flex; }
textarea {
  display: block; width: 100%; resize: none; font: inherit; padding: 10px 18px; border-radius: 22px; height: 46px; max-height: 160px;
  border: 1px solid var(--gold-dim); background: var(--box); color: var(--text); outline: none;
}
textarea::placeholder { color: var(--muted); }
textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-dim); }
button.send {
  display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 22px 0 8px; border: 0; border-radius: 23px;
  background: var(--paper); color: var(--ink); font: 600 15px var(--serif); letter-spacing: .1em; cursor: pointer;
  box-shadow: 0 2px 10px rgba(0,0,0,.25); transition: filter .15s;
}
button.send .ring { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #f2c34e; display: grid; place-items: center; }
button.send .ring::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #f2c34e; }
button.send:hover { filter: brightness(1.05); }
button.send:disabled { opacity: .55; cursor: default; }

@media (max-width: 640px) {
  header { padding-top: 14px; }
  header h1 { font-size: 18px; gap: 10px; }
  header h1::before, header h1::after { width: 36px; }
  .npc { padding: 12px 16px 14px; }
  .opt { min-width: 0; width: 100%; }
  .me { max-width: 90%; }
  button.send { padding: 0 8px; }
  button.send .label { display: none; }
}
</style>
</head>
<body>
<div class="sky"></div>
<div class="app">
  <header>
    <h1><span class="diamond"></span>原神配队助手<span class="diamond"></span></h1>
    <div class="meta" id="meta"></div>
    <label class="auto" id="auto-box" hidden><input type="checkbox" id="auto">派蒙自动念回答</label>
  </header>
  <div id="log"></div>
  <form id="ask">
    <div class="field">
      <textarea id="q" rows="1" placeholder="想问谁怎么配队、怎么养成？" title="Enter 发送，Shift+Enter 换行"></textarea>
    </div>
    <button class="send" id="send"><span class="ring"></span><span class="label">发送</span></button>
  </form>
</div>
<script>
const NPC = "派蒙";
const GREETING = "旅行者，想问哪位角色？派蒙都帮你安排！";  // 服务端没给开场白时才用
const EXAMPLES = ["我有沃雅妮莎，怎么配队？", "那维莱特 0 命怎么配队", "我没有芙宁娜和万叶，水龙怎么配", "阿罗夏 1 命怎么养成"];
const STAR = '<svg class="star" viewBox="0 0 24 24"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/></svg>';
const BUBBLE = '<svg viewBox="0 0 24 24"><path d="M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/></svg>';
const SPEAKER = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const $ = s => document.querySelector(s);
let last = null, busy = false, voiceOn = false;

function esc(s) { return s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>"); }
// 够用的 Markdown：标题、列表、粗体、段落
function md(text) {
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of text.split("\n")) {
    const line = raw.trimEnd();
    let m;
    if ((m = line.match(/^#{1,4}\s+(.*)/))) { close(); out.push(`<h4>${inline(m[1])}</h4>`); }
    else if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); }
    else if ((m = line.match(/^\s*(\d+)[.、]\s+(.*)/))) { if (list !== "ol") { close(); out.push(`<ol start="${m[1]}">`); list = "ol"; } out.push(`<li>${inline(m[2])}</li>`); }
    else if (!line.trim()) { close(); }
    else { close(); out.push(`<p>${inline(line)}</p>`); }
  }
  close();
  return out.join("");
}

// 派蒙语音：一段一段合成、一段一段播，播当前段时先取下一段
const player = {audio: null, button: null, run: 0};
function stopVoice() {
  player.run++;
  if (player.audio) { player.audio.pause(); player.audio = null; }
  if (player.button) player.button.classList.remove("on");
  document.querySelectorAll(".speaking").forEach(el => el.classList.remove("speaking"));
  player.button = null;
}
async function speakText(text) {
  const r = await fetch("/api/speak", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text})});
  return r.ok ? URL.createObjectURL(await r.blob()) : null;
}
async function speak(reply) {
  const button = reply.querySelector(".say");
  const wasMine = player.button === button;
  stopVoice();
  if (wasMine) return true;  // 再点一次就停
  const run = player.run;
  player.button = button; button?.classList.add("on");
  // 开场白有预先合成好的整段语音，直接播文件
  const cached = reply.dataset.audio;
  const parts = cached ? [reply.querySelector(".body")]
    : [...reply.querySelectorAll(".body p, .body li, .body h4")].filter(el => !el.classList.contains("dots") && el.textContent.trim());
  const speakBlob = cached ? () => Promise.resolve(cached) : speakText;
  let next = parts.length ? speakBlob(parts[0].textContent) : null;
  for (let i = 0; i < parts.length && run === player.run; i++) {
    const url = await next;
    next = i + 1 < parts.length ? speakBlob(parts[i + 1].textContent) : null;
    if (!url || run !== player.run) continue;
    parts[i].classList.add("speaking");
    const audio = player.audio = new Audio(url);
    const ok = await new Promise(done => {
      audio.onended = audio.onerror = audio.onpause = () => done(true);
      audio.play().catch(() => done(false));  // 浏览器不让没点过的页面出声
    });
    if (!ok && cached) { parts[i].classList.remove("speaking"); stopVoice(); return false; }
    parts[i].classList.remove("speaking");
    if (url.startsWith("blob:")) URL.revokeObjectURL(url);
  }
  if (run === player.run) stopVoice();
  return true;
}
function addSpeaker(reply) {
  if (!voiceOn || reply.querySelector(".say")) return;
  const b = document.createElement("button");
  b.className = "say"; b.type = "button"; b.title = "听派蒙念"; b.innerHTML = SPEAKER;
  b.onclick = () => speak(reply);
  reply.querySelector(".name").appendChild(b);
}

function scrollDown() { $("#log").scrollTop = $("#log").scrollHeight; }
function npc(html) {
  const d = document.createElement("div");
  d.className = "npc";
  d.innerHTML = `<div class="name">${STAR}${NPC}</div><div class="body">${html}</div>`;
  $("#log").appendChild(d); scrollDown();
  return d;
}
function me(text) {
  const d = document.createElement("div");
  d.className = "me"; d.textContent = text;
  $("#log").appendChild(d); scrollDown();
}
// 一组对话选项，点了就当作玩家说的话
function options(parent, items) {
  const box = document.createElement("div"); box.className = "options";
  for (const text of items) {
    const b = document.createElement("button"); b.className = "opt"; b.type = "button";
    b.innerHTML = `<span class="icon">${BUBBLE}</span><span></span>`;
    b.lastChild.textContent = text;
    b.onclick = () => ask(text);
    box.appendChild(b);
  }
  parent.appendChild(box);
  return box;
}
// 段落依次浮现，像游戏里一句一句出来
function stagger(body) { [...body.children].forEach((el, i) => el.style.animationDelay = `${Math.min(i, 12) * 0.12}s`); }

async function ask(question) {
  if (busy || !question.trim()) return;
  busy = true; $("#send").disabled = true; stopVoice();
  document.querySelectorAll(".opt").forEach(b => b.disabled = true);
  me(question);
  const reply = npc('<p class="dots"><span>·</span><span>·</span><span>·</span></p>');
  const body = reply.querySelector(".body");
  try {
    const r = await fetch("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({question, last})});
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    last = data.query;
    body.innerHTML = md(data.answer);
    stagger(body);
    addSpeaker(reply);
    if ($("#auto").checked) speak(reply);
    if (!data.explained_by_llm) body.insertAdjacentHTML("beforeend", `<span class="tag">大模型解释失败，下面是引擎原始结果</span>`);
    if (data.facts.status === "need_carry")  // 问辅助：候选主C做成对话选项
      options(reply, data.facts.candidates.map(c => "搭配" + c.zh));
    reply.insertAdjacentHTML("beforeend",
      `<details><summary>详细数据</summary><pre>${esc(JSON.stringify({query: data.query, facts: data.facts}, null, 1))}</pre></details>`);
  } catch (e) {
    reply.classList.add("err"); body.textContent = "出了点岔子：" + e.message;
  } finally {
    busy = false; $("#send").disabled = false;
    document.querySelectorAll(".opt").forEach(b => b.disabled = false);
    scrollDown();
  }
}

const q = $("#q");
function fit() { q.style.height = "46px"; q.style.height = Math.min(q.scrollHeight + 2, 160) + "px"; }
q.oninput = fit;
q.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#ask").requestSubmit(); } };
$("#ask").onsubmit = e => { e.preventDefault(); const v = q.value; q.value = ""; fit(); ask(v); };

const auto = $("#auto");
try { auto.checked = localStorage.getItem("paimon-auto-voice") === "1"; } catch (e) {}
auto.onchange = () => { try { localStorage.setItem("paimon-auto-voice", auto.checked ? "1" : "0"); } catch (e) {} };
let hello = null;
function greet(text) {
  hello = npc(`<p>${esc(text)}</p>`);
  options(hello, EXAMPLES);
}
q.focus();
fetch("/api/state").then(r => r.json()).then(s => {
  greet(s.greeting || GREETING);
  const style = s.paimon === "ready" ? "，派蒙改写已开启" : s.paimon === "off" ? "" : "，派蒙改写模型未就绪（先显示原回答）";
  const voice = {ready: "，派蒙语音已开启", offline: "，派蒙语音服务还没起来", error: "，派蒙语音模型加载失败"}[s.voice] || "";
  $("#meta").textContent = s.model ? `由 ${s.model} 解读${style}${voice}` : "";
  // 语音服务可能还在加载：只要有模型就给喇叭，点的时候再看服务好没好
  voiceOn = !["off", "nomodel"].includes(s.voice);
  $("#auto-box").hidden = !voiceOn;
  if (voiceOn) document.querySelectorAll(".npc").forEach(addSpeaker);
  // 开场白语音是启动时存好的文件，一打开就念；浏览器拦了自动播放，就等第一次点页面或按键再念
  if (s.greeting_audio) {
    hello.dataset.audio = "/api/greeting.wav";
    speak(hello).then(played => {
      if (played) return;
      const once = e => {
        removeEventListener("pointerdown", once, true); removeEventListener("keydown", once, true);
        if (!e.target.closest?.("button") && !busy && !player.button && !document.querySelector(".me")) speak(hello);
      };
      addEventListener("pointerdown", once, true); addEventListener("keydown", once, true);
    });
  }
}).catch(() => { if (!hello) greet(GREETING); });
</script>
</body>
</html>
