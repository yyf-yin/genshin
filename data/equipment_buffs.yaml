# 会给队友加成的圣遗物套装和武器（草稿，按 data/game/ 里的原文起草，未逐条核对）。
# 某个角色的配装（builds/）首选了这里的装备时，引擎把 provides 加到这个角色身上：
# 砂糖 = 技能增益 + 翠绿之影 + 讨龙英杰谭。只写给队友的部分，只给装备者自己的不写。
# value：圣遗物按原文；武器按精炼 1（4 星武器常见满精，note 里写了精 5 的数值）。
# 依赖队伍条件的（扩散/结晶到的元素、月兆等级）先按「条件满足」写，score 调低一些表示不稳定。
equipment:
  # ---------- 圣遗物（4 件套） ----------
  - kind: artifact_set
    zh: 翠绿之影
    provides:
      - {tag: shred:pyro, score: 1.0, value: 0.4}
      - {tag: shred:hydro, score: 1.0, value: 0.4}
      - {tag: shred:electro, score: 1.0, value: 0.4}
      - {tag: shred:cryo, score: 1.0, value: 0.4}
    note: 只降低被扩散到的元素的抗性；星扩散也降冰抗。实际生效的是队里有、且被扩散到的元素
  - kind: artifact_set
    zh: 深林的记忆
    provides:
      - {tag: shred:dendro, score: 1.0, value: 0.3}
  - kind: artifact_set
    zh: 昔日宗室之仪
    provides:
      - {tag: buff:atk_pct, score: 0.8, value: 0.2}
    note: 施放元素爆发后 12 秒
  - kind: artifact_set
    zh: 千岩牢固
    provides:
      - {tag: buff:atk_pct, score: 0.8, value: 0.2}
    note: 元素战技命中后 3 秒，需要频繁命中；另有护盾强效 +30%
  - kind: artifact_set
    zh: 教官
    provides:
      - {tag: buff:em, score: 0.7, value: 120}
    note: 4 星套装，触发元素反应后 8 秒
  - kind: artifact_set
    zh: 悠古的磐岩
    provides:
      - {tag: element_dmg_buff:pyro, score: 0.5, value: 0.35}
      - {tag: element_dmg_buff:hydro, score: 0.5, value: 0.35}
      - {tag: element_dmg_buff:electro, score: 0.5, value: 0.35}
      - {tag: element_dmg_buff:cryo, score: 0.5, value: 0.35}
    note: 按拾取的晶片元素给加成，同时只有一种；需要岩元素结晶或月结晶
  - kind: artifact_set
    zh: 炉火融炼之心
    provides:
      - {tag: reaction_buff:stellar_superconduct, score: 0.8, value: 0.5}
      - {tag: reaction_buff:stellar_swirl, score: 0.8, value: 0.5}
    note: 装备者触发星烁反应或造成星烁反应伤害后 12 秒
  - kind: artifact_set
    zh: 纺月的夜歌
    provides:
      - {tag: buff:em, score: 0.7, value: 120}
      - {tag: reaction_buff:lunar_charged, score: 0.4, value: 0.1}
      - {tag: reaction_buff:lunar_bloom, score: 0.4, value: 0.1}
      - {tag: reaction_buff:lunar_crystallize, score: 0.4, value: 0.1}
    note: 精通 +120 需要月兆·满辉（初辉为 +60）；月曜增伤按队伍里不同的「月辉明光」种数计算
  - kind: artifact_set
    zh: 穹境示现之夜
    provides:
      - {tag: reaction_buff:lunar_charged, score: 0.4, value: 0.1}
      - {tag: reaction_buff:lunar_bloom, score: 0.4, value: 0.1}
      - {tag: reaction_buff:lunar_crystallize, score: 0.4, value: 0.1}
    note: 暴击率提升只给装备者；月曜增伤按「月辉明光」种数计算

  # ---------- 武器 ----------
  - kind: weapon
    zh: 讨龙英杰谭
    provides:
      - {tag: buff:atk_pct, score: 0.8, value: 0.24}
    note: 只给下一个登场的角色；精 5 为 48%
  - kind: weapon
    zh: 苍古自由之誓
    provides:
      - {tag: buff:atk_pct, score: 0.8, value: 0.2}
      - {tag: buff:dmg_bonus, score: 0.5, value: 0.16}
    note: 增伤只对普通攻击、重击、下落攻击；千年的大乐章同类效果不叠加
  - kind: weapon
    zh: 终末嗟叹之诗
    provides:
      - {tag: buff:atk_pct, score: 0.8, value: 0.2}
      - {tag: buff:em, score: 0.8, value: 100}
  - kind: weapon
    zh: 松籁响起之时
    provides:
      - {tag: buff:atk_pct, score: 0.8, value: 0.2}
  - kind: weapon
    zh: 千夜浮梦
    provides:
      - {tag: buff:em, score: 0.6, value: 40}
  - kind: weapon
    zh: 圣显之钥
    provides:
      - {tag: buff:em, score: 0.6}
    note: 按装备者生命值上限的 0.2% 给全队精通
  - kind: weapon
    zh: 岩峰巡歌
    provides:
      - {tag: buff:dmg_bonus, score: 0.7, value: 0.256}
    note: 所有元素伤害加成，按装备者防御力，至多 25.6%
  - kind: weapon
    zh: 祭星者之望
    provides:
      - {tag: buff:dmg_bonus, score: 0.7, value: 0.28}
    note: 只给当前场上角色，需要装备者创造护盾
  - kind: weapon
    zh: 尘光七谕
    provides:
      - {tag: buff:dmg_bonus, score: 0.7, value: 0.26}
    note: 只给当前场上角色，需要装备者创造护盾，按攻击力至多 26%
  - kind: weapon
    zh: 黑蚀
    provides:
      - {tag: buff:atk_pct, score: 0.4, value: 0.16}
    note: 元素爆发命中后 3 秒；魔导·秘仪时效果额外提升 75%
  - kind: weapon
    zh: 纺夜天镜
    provides:
      - {tag: reaction_buff:bloom, score: 0.8, value: 1.2}
      - {tag: reaction_buff:hyperbloom, score: 0.8, value: 0.8}
      - {tag: reaction_buff:burgeoning, score: 0.8, value: 0.8}
      - {tag: reaction_buff:lunar_bloom, score: 0.8, value: 0.4}
  - kind: weapon
    zh: 支离轮光
    provides:
      - {tag: reaction_buff:lunar_charged, score: 0.8, value: 0.4}
    note: 需要装备者创造护盾
  - kind: weapon
    zh: 霜结的誓金枝
    provides:
      - {tag: element_dmg_buff:geo, score: 0.6, value: 0.2}
      - {tag: reaction_buff:lunar_crystallize, score: 0.6, value: 0.2}
    note: 需要附近存在月笼，只给其他角色
  - kind: weapon
    zh: 柔风游弦
    provides:
      - {tag: reaction_buff:stellar_superconduct, score: 0.7, value: 0.24}
      - {tag: reaction_buff:stellar_swirl, score: 0.7, value: 0.24}
    note: 精 5 为 48%
  - kind: weapon
    zh: 流浪的晚星
    provides:
      - {tag: buff:atk_flat, score: 0.4}
    note: 按装备者精通给其他角色加攻击力，数值小
  - kind: weapon
    zh: 漩流颂歌
    provides:
      - {tag: buff:atk_pct, score: 0.7, value: 0.24}
    note: 只给当前场上角色，需要装备者治疗、生命值上限 40000 以上，3 层至多 24%；附近触发冻结或星扩散后 5 秒内再提高 75%
  - kind: weapon
    zh: 香韵奏者
    provides:
      - {tag: buff:atk_pct, score: 0.7, value: 0.32}
    note: 装备者进行治疗后，受到治疗的角色攻击力 +32%，持续 3 秒；装备者自己的攻击力加成不写
  - kind: weapon
    zh: 寒息
    provides:
      - {tag: energy_battery, score: 0.4, value: 6}
    note: 触发冰、水相关反应后给其他队友回 6 点能量，每 16 秒一次；精 5 为 12 点
