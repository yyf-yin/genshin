# 重新生成：python -m genshin_assistant import-gamedata
tutorials:
  elemental_aura:
  - 某些环境与水元素属性的攻击，可能会使生物附着水元素。水元素与其他元素交汇时，也可能会引发「元素反应」…
  - 被「冰元素」攻击击中的话，会附着冰元素属性。并使移动速度降低。冰元素与其他元素接触时，还可能会引发「元素反应」…
  - 「火元素」属性的攻击，可能会使生物附着火元素。火元素与其他元素交汇时，也可能会引发「元素反应」…
  - 元素附着可以破除隐身状态。
  frozen:
  - 「冰元素」与「水元素」交汇时，会产生「冻结」反应…生物被冻结时将无法行动。但也会变得硬邦邦…
  vaporize:
  - 「火元素」与「水元素」接触时，会引发「蒸发」反应…蒸发反应后，原本附带的水元素或火元素会随着蒸汽消散…
  - 「蒸发」反应本身没有伤害。但是，通过「火元素」或「水元素」攻击导致蒸发时，会按照一定的比例提高该次攻击造成的伤害…
  melt:
  - 「冰元素」与「火元素」接触时，会引发「融化」反应…融化反应后，原本附带的冰元素或火元素会随着反应消散…
  - 「融化」反应本身没有伤害。但是，通过「火元素」或「冰元素」攻击导致融化时，会按照一定的比例提高该次攻击造成的伤害…
  electro_charged:
  - 「雷元素」触及「水元素」时，会引发「感电」反应，在效果期间，持续造成雷元素伤害。
  - 如果周围有附着「水元素」的敌人，「感电」反应会间歇性地向周围放电。
  overloaded:
  - 「火元素」触及「雷元素」时，能引发「超载」反应！超载反应会引发剧烈的爆炸，造成火元素的范围伤害。爆炸似乎可以轻易摧毁一些坚硬的物体…
  superconduct:
  - 「冰元素」触及「雷元素」时，能引发「超导」反应…超导会造成冰元素的范围伤害，并大幅降低受超导影响生物的物理抗性。
  swirl:
  - 「风元素」与一些元素交汇时，可能引发「扩散」！扩散能造成对应元素的伤害，产生附着，或进一步引发其他反应…
  crystallize:
  - 「岩元素」与水/火/冰/雷元素接触时，会发生「结晶」反应！
  - 这种反应能产生对应元素的晶片，能为角色提供各种元素护盾！利用结晶反应，可以有效降低战斗中受到的伤害…
  quicken:
  - 生物受到雷元素与草元素影响后，将会引发「原激化」反应，使其处于原激化状态下。
  - 处于原激化状态下的生物受到雷元素或草元素攻击时，将分别引发「超激化」或「蔓激化」反应，受到额外的伤害。
  bloom:
  - 生物受到水元素与草元素影响后，将会引发「绽放」反应，产生草原核。
  - 草原核接触火元素时，将会引发「烈绽放」，造成更强的草元素范围伤害；遇到雷元素则会发生「超绽放」反应，将草原核转化为具有追踪能力的蔓生弹。
  elemental_shield:
  - 破除元素盾最有效的方法，是利用能与其元素发生反应的元素攻击…虽然物理攻击与无法与其反应的元素也不是不能击破元素盾，但是效率…
  energy:
  - 施放「元素爆发」吧！施放元素爆发会消耗角色所有元素能量。
  - 吸收「元素晶球」与「元素微粒」，可以补充元素能量…造成元素伤害、打倒敌人等行为都可能产生元素晶球与微粒…
  shield:
  - 护盾能替角色承担伤害！但如果承受过多伤害，护盾也会失效…
  moonsign:
  - |-
    队伍中编入月兆角色时，将会根据月兆角色的数量，提升队伍的月兆等级。
    队伍的月兆等级提升时，月兆角色的部分技能将获得强化，部分武器与圣遗物的效果也会获得提升，其它角色也能为队伍提供增益效果。
    此外，在新月升起的挪德卡莱，似乎还有其他方式来提升队伍的月兆等级…
  lunar_charged:
  - |-
    「雷元素」触及「水元素」时，若满足特定条件，会引发特殊的「月感电」反应，形成雷暴云，持续对周围同时附着「雷元素」与「水元素」的目标进行雷击，造成雷元素伤害。
    该伤害可以触发暴击，且造成的伤害取决于所有在反应中施加元素的角色。
  lunar_bloom:
  - |-
    「草元素」触及「水元素」时，若满足特定条件，会引发特殊的「月绽放」反应，在原本的绽放反应效果之上，还会为队伍提供珍贵的「草露」资源。
    部分角色可以通过消耗「草露」，或通过自身的天赋特性，对敌人造成月绽放反应伤害，该伤害可以触发暴击。
  - |-
    队伍中的角色触发月绽放反应后的2.5秒内，每2.5秒便会为队伍提供一枚草露。
    草露上限为三枚。持续期间，再次触发月绽放反应时，将刷新上述效果的持续时间。
  - 部分角色可以消耗草露，对敌人造成月绽放反应伤害。
  lunar_crystallize:
  - 「岩元素」触及「水元素」时，若满足特定条件，会引发特殊的「月结晶」反应，在目标附近生成三枚月笼。
  - |-
    每触发三次月结晶反应，便会引发月笼谐奏，对附近的敌人造成岩元素伤害。
    该伤害可以触发暴击，且造成的伤害取决于所有在反应中施加元素的角色。
  stellar_superconduct:
  - |-
    「冰元素」触及「雷元素」时，若满足特定条件，会引发特殊的「星超导」反应，创造「星辉棱晶」，并将其附近的区域短暂变换为奇妙的「极星辉域」。
    领域内的所有角色将会获得冰元素与雷元素伤害加成；处于极星辉域中的敌人被冰元素或雷元素攻击命中时，极星辉域会冻存这些溢散的元素力，并每隔4秒将冻存的元素力全部释放，进一步提升上述伤害加成，并使星超导反应的基础反应系数提升，持续4秒。
    此外，处于极星辉域中的敌人，物理抗性将会降低。
  - |-
    处于极星辉域中，部分角色还会获得额外的辉映·星超导效果，使部分天赋与技能的效果获得强化。
    部分角色可以通过自身的天赋特性，对敌人造成星超导反应伤害，该伤害可以触发暴击。
  stellar_swirl:
  - |-
    「风元素」触及「冰元素」时，若满足特定条件，会引发特殊的「星扩散」反应，对敌人造成一次风元素伤害，并创造「星辉风旋」。
    多次触发星扩散反应，可以提升星辉风旋的等级；星辉风旋会在一定时间后或触发一定次数的星扩散反应后引爆，对附近的敌人造成冰元素范围伤害。
    上述伤害均可触发暴击。
  - |-
    在一定范围内，至多存在一个星辉风旋。
    星辉风旋处于场上时，触发一定次数的星扩散反应后，星辉风旋将会提升至二级，在引爆时对更大范围内的敌人造成更高的冰元素范围伤害。

    触发星扩散反应后的8秒内，附近的部分角色还会获得额外的辉映·星扩散效果，使部分天赋与技能的效果获得强化。
    部分角色可以通过自身的天赋特性，对敌人造成星扩散反应伤害，该伤害可以触发暴击。
