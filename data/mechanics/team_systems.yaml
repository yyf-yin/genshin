# 和配队直接相关的系统机制。手写。元素共鸣的官方原文见 official_resonance.yaml（自动生成）。

systems:
  - id: moonsign
    zh: 月兆
    since: "6.0"
    verified: false
    official: official_tutorials.yaml 的 moonsign
    text: |-
      挪德卡莱的月兆角色编入队伍时，按月兆角色数量提升队伍的「月兆等级」：1 名为「月兆·初辉」，2 名及以上为「月兆·满辉」。
      等级提升后，月兆角色的部分技能强化，部分武器、圣遗物效果提升；非月兆角色施放技能时也能为队伍提供月曜反应相关的增益。
      天赋里写「月兆·满辉：……」的效果，只有队里至少 2 名月兆角色时才生效。
    team_rule: 天赋或命座带「月兆·满辉」前缀的效果，需要队伍里有 2 名及以上月兆角色
    source: 官方教程只说「根据月兆角色的数量」，初辉/满辉的人数门槛来自社区资料，待核实

  - id: magic_arts
    zh: 魔导·秘仪
    since: "6.x"
    verified: true
    text: |-
      完成对应角色的「魔女的课业」任务后，该角色成为「魔导角色」，并解锁额外天赋，部分技能、突破天赋、命座效果也会变化。
      队伍里有至少 2 名魔导角色时获得「魔导·秘仪」，魔导角色进一步强化；部分武器、圣遗物也有「魔导·秘仪」附加效果。
      每个魔导角色的「魔导·秘仪」效果写在角色数据的 witch_quest 字段。
      注意：genshin-db 的天赋数据不含魔女的课业带来的额外天赋和技能变化，评估这些角色时要提醒用户以游戏内为准。
    team_rule: 「魔导·秘仪」效果需要队伍里有 2 名及以上魔导角色，且这些角色都完成了各自的魔女的课业
    source: 游戏内文本（魔女的课业说明、各角色魔导·秘仪说明）

  - id: radiance
    zh: 辉映·星烁
    since: "7.0"
    verified: true
    text: |-
      辉映·星超导（处于星超导产生的极星辉域中）与辉映·星扩散（附近触发星扩散后 8 秒内）统称辉映·星烁。
      角色同时只能受一种辉映影响，优先辉映·星超导。天赋写「辉映·星烁：……」的效果只在辉映状态下生效。
    team_rule: 要吃到「辉映·星烁」效果，队伍需要能稳定触发星超导或星扩散（见 reactions.yaml）
    source: 游戏内名词解释 11500004、教程 39001-39102

combat_basics:
  - id: element_gauge
    zh: 元素附着量与反应消耗
    verified: true
    text: |-
      攻击带有元素量（1U、2U、4U 等）。附着在敌人身上的元素会随时间衰减。
      反应会消耗底层元素：蒸发、融化里 2 倍系数的一方消耗 2 倍元素量，1.5 倍的一方只消耗 0.5 倍。
      这就是「火打冰」融化能持续、「冰打火」难以维持的原因，也是攻略里说「挂火量不够/挂水太多抢元素」的依据。
      元素共鸣会缩短部分元素附着时间（见 official_resonance.yaml）。

  - id: icd
    zh: 元素附着冷却（ICD）
    verified: true
    text: |-
      同一技能连续命中时并不是每一下都附着元素。标准规则：同一组攻击在 2.5 秒内或每 3 次命中只附着一次元素（满足任一条件即重置）。
      很多后台挂元素技能有自己的规则（例如无 ICD），所以「挂元素频率」要看具体角色，攻略里通常会写。
      对配队的意义：决定一个角色能不能稳定提供某种挂元素功能（*_application 标签）。

  - id: interruption
    zh: 抗打断（韧性）
    verified: true
    text: |-
      攻击动作被敌人打断会让输出循环中断。护盾和部分技能（例如那维莱特 1 命）提供抗打断。
      长时间蓄力或站桩输出的主C（那维莱特 0 命、法器重击类）通常要护盾或抗打断队友。

  - id: on_off_field
    zh: 站场与后台
    verified: true
    text: |-
      一个队伍同一时间只有一名角色在场上。主C一般长时间站场；副C、辅助通过元素战技或元素爆发召唤物、领域、协同攻击在后台持续生效。
      两个都需要长时间站场的角色放在一队会互相抢场上时间，这是配队里常见的冲突。
      判断方法：看技能描述里有没有「处于队伍后台时，依然…」「持续 x 秒」「召唤」「协同攻击」等字样。

  - id: snapshot
    zh: 快照
    verified: true
    text: 部分召唤物或持续技能在施放那一刻锁定面板（快照），之后的增益不影响它；也有实时计算的。会影响「先上增益再放技能」的出手顺序。
