# 伤害计算。手写，游戏内没有完整公式，数值来自社区实测（KQM TCL、原神 wiki 伤害公式页）。
# verified: true 表示多年来被反复验证、版本间没变过；false 表示较新的机制，需要对照攻略或实测再确认。
# 文中的 Lv倍率 指 level_multiplier 表里的值。

formula:
  verified: true
  summary: 伤害 = 基础伤害 × 增伤区 × 暴击区 × 防御区 × 抗性区 × 增幅反应区 × 擢升区
  zones:
    - id: base
      zh: 基础伤害
      text: |-
        技能倍率 × 对应属性（攻击力 / 生命值上限 / 防御力 / 元素精通，看技能写的是什么）+ 固定值加成。
        固定值加成包括：申鹤冰翎、云堇飞云旗阵、超激化/蔓激化的额外伤害、部分角色「基于xx提升伤害」的效果。
        攻击力 = 白值攻击（角色 + 武器）×（1 + 攻击力%）+ 固定攻击力；生命值、防御力同理。
    - id: dmg_bonus
      zh: 增伤区
      text: |-
        1 + 所有「造成的伤害提升」「xx元素伤害加成」「普通攻击/重击/元素战技/元素爆发造成的伤害提升」之和。
        同一个区内是加法，所以已经堆了很多增伤时，再加一点增伤收益会下降。
    - id: crit
      zh: 暴击区
      text: |-
        暴击时 ×（1 + 暴击伤害），不暴击 ×1。期望值为 1 + 暴击率 × 暴击伤害（暴击率上限 100%）。
        常说的「暴击率:暴击伤害 ≈ 1:2」就是在总词条一定时让期望最大化的比例。
    - id: defense
      zh: 防御区
      text: |-
        (角色等级 + 100) / [(角色等级 + 100) + (敌人等级 + 100) × (1 - 减防%) × (1 - 无视防御%)]
        90 级角色打 100 级敌人、无减防时约为 0.487。剧变反应、月曜反应、星烁反应伤害不吃防御区。
    - id: resistance
      zh: 抗性区
      text: |-
        设敌人抗性为 R（减抗后）：R < 0 时为 1 - R/2；0 ≤ R < 75% 时为 1 - R；R ≥ 75% 时为 1/(1 + 4R)。
        大多数敌人基础抗性 10%，所以减抗 40%（风套、钟离）后变成 -30%，抗性区约 1.15。
    - id: amplifying
      zh: 增幅反应区
      text: 只对蒸发、融化生效，见 reactions.yaml。
    - id: elevate
      zh: 擢升区
      text: |-
        游戏内名词「擢升」：特殊的伤害提升效果，与其他的伤害提升效果分别独立计算。
        也就是单独乘一个 (1 + 擢升%)，不和增伤区相加，所以价值比同数值的增伤高。目前主要出现在月曜、星烁相关角色的命座和天赋里。
      verified: false
      source: 游戏内名词解释 11190007（data/game/glossary.yaml）；「单独乘区」是按官方说法的理解，未实测

level_multiplier:
  verified: true
  zh: 剧变反应的等级系数（按触发者的角色等级）
  note: 社区普遍认为月曜反应也用这张表（未核实）；星烁反应是否用这张表未知
  values: {1: 17.17, 20: 80.58, 40: 207.38, 50: 323.60, 60: 492.88, 70: 765.64, 80: 1077.44, 90: 1446.85}

elemental_mastery:
  verified: true
  zh: 元素精通的收益公式（EM = 元素精通）
  amplifying: 2.78 × EM / (EM + 1400)
  transformative: 16 × EM / (EM + 2000)
  additive: 5 × EM / (EM + 1200)
  crystallize_shield: 4.44 × EM / (EM + 1400)
  lunar: 6 × EM / (EM + 2000)
  lunar_verified: false

energy:
  verified: true
  text: |-
    元素爆发需要攒满元素能量。微粒/晶球回能：同元素晶球 3 点、微粒 1 点；不同元素 ×1/3，无色 ×2/3；后台角色再 ×0.6。
    最终回能 × 元素充能效率，所以「充能需求」取决于队伍里同元素产球多少、角色是否站场。
    攻略里的「充能 180%」这类建议就是在算这个。
