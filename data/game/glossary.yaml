terms:
- id: 210101
  name: 浪涌冲击
  text: 角色对敌人触发蒸发反应时释放，造成水元素伤害
- id: 210102
  name: 炽燃爆轰
  text: 角色对敌人触发蒸发反应时释放，造成火元素伤害
- id: 210201
  name: 萦绕种
  text: 每产生一枚草原核，都将在当前场上角色周围生成一枚萦绕种（至多同时存在4枚）：触碰敌人后将被消耗，对其造成草元素伤害
- id: 210301
  name: 荒火冲击
  text: 通过燃烧反应对敌人造成伤害时，将对该敌人进行计数，计数达到6时，将清空计数释放，造成火元素范围伤害
- id: 210302
  name: 助燃响核
  text: 角色草元素伤害命中燃烧状态的敌人后触发，造成草元素伤害
- id: 210401
  name: 火晶庇佑
  text: 使队伍中所有角色获得50%火元素与岩元素伤害加成。此外，每4秒，将获取附近的结晶反应产生的晶片
- id: 210402
  name: 迸火冲击
  text: 火晶庇佑效果持续期间，每6秒，将在角色的位置释放，造成火元素范围伤害
- id: 210403
  name: 岩晶破袭
  text: 火晶庇佑效果持续期间，每4秒，将在角色的位置释放，造成岩元素范围伤害
- id: 210501
  name: 雷晶庇佑
  text: 使队伍中所有角色获得70%雷元素与岩元素伤害加成。此外，每4秒，将获取附近的结晶反应产生的晶片
- id: 210502
  name: 轰转磐岩
  text: 雷晶庇佑效果持续期间，角色的攻击命中敌人后，将在敌人的位置降下，造成岩元素伤害
- id: 210503
  name: 轰转磐岩
  text: 雷晶庇佑效果持续期间，角色的元素爆发命中敌人后，将在敌人的位置降下，造成岩元素伤害
- id: 210601
  name: 易碎
  text: 敌人的火元素与雷元素抗性降低5.5%，至多叠加4层
- id: 210602
  name: 爆炎火球
  text: 对处于易碎效果影响下的敌人造成雷元素伤害后，对场上所有处于易碎效果的敌人释放，造成火元素伤害
- id: 210603
  name: 霆雷打击
  text: 对处于易碎效果影响下的敌人造成火元素伤害后，对场上所有处于易碎效果的敌人释放，造成雷元素伤害
- id: 210701
  name: 茂雷飞核
  text: 角色对敌人触发原激化、超激化或者蔓激化反应时发射，命中敌人后爆炸，造成草元素范围伤害
- id: 210702
  name: 丰饶落雷
  text: 角色对处于原激化状态下的敌人造成雷元素或草元素伤害后降下，造成雷元素伤害
- id: 210901
  name: 风之祝祷·水
  text: 角色触发扩散反应造成的伤害提升80%，星扩散反应造成的伤害提升8%，角色的生命值上限提升8%
- id: 210902
  name: 疗愈水球
  text: 记录角色治疗的生命值回复量，持续时间结束后爆炸，基于记录的治疗量和风之祝祷·水的层数对周围的敌人造成水元素范围伤害
- id: 210903
  name: 水瀑旋涡
  text: 牵引附近的敌人，并基于风之祝祷·水的层数造成水元素范围伤害
- id: 211001
  name: 风之祝祷·雷
  text: 角色触发扩散反应造成的伤害提升80%，星扩散反应造成的伤害提升8%，且每次获得风之祝祷·雷时为队伍中所有角色恢复2点元素能量
- id: 211002
  name: 迅切雷刃
  text: 角色施放元素爆发时，将生成迅切印记。当前场上角色的攻击命中敌人时，将消耗迅切印记释放迅切雷刃，基于风之祝祷·雷的层数，对路径上的敌人造成雷元素伤害
- id: 211003
  name: 霆跃雷击
  text: 风之祝祷·雷持续期间，下落攻击命中敌人时释放，基于风之祝祷·雷的层数计算伤害，造成雷元素范围伤害
- id: 211101
  name: 电涌
  text: 队伍中所有角色触发感电反应造成的伤害提升250%，触发月感电反应造成的伤害提升70%
- id: 211102
  name: 浮雷攻核
  text: 电涌效果持续期间，跟随当前场上角色生成；角色的攻击命中敌人后，将向敌人释放3枚雷弹，造成雷元素伤害
- id: 211103
  name: 雳云
  text: |-
    电涌效果持续期间生成，每2秒随机进行一次以下形式的攻击：
    1.雳云落雷：对影响范围内的敌人造成雷元素伤害，为当前场上角色恢复2点元素能量；
    2.雳云暴雨：对影响范围内的敌人造成水元素伤害，为当前场上角色恢复5%生命值
- id: 211201
  name: 火晶庇佑
  text: 使队伍中所有角色获得70%火元素与岩元素伤害加成。此外，每4秒，将获取附近的结晶反应产生的晶片
- id: 211202
  name: 岩晶破袭
  text: 火晶庇佑效果持续期间，将间歇性在角色的位置释放，造成岩元素范围伤害
- id: 211203
  name: 轰转磐岩
  text: 火晶庇佑效果持续期间，角色的普通攻击、重击或下落攻击命中敌人时，将在敌人的位置降下，造成岩元素伤害
- id: 211301
  name: 冰晶庇佑
  text: 使队伍中所有角色获得70%冰元素与岩元素伤害加成。此外，每4秒，将获取附近的结晶反应产生的晶片
- id: 211302
  name: 岩晶强袭
  text: 冰晶庇佑效果持续期间，将间歇性在角色的位置释放，造成岩元素范围伤害
- id: 211303
  name: 碎冰迸石
  text: 冰晶庇佑效果持续期间，队伍中冰元素或岩元素角色造成暴击时，将在敌人的位置降下，造成岩元素伤害
- id: 211401
  name: 冰霜崩破
  text: 当前场上的火元素角色触发融化反应后释放，造成冰元素伤害
- id: 211402
  name: 炽升火柱
  text: 当前场上的冰元素角色触发融化反应后释放，造成火元素伤害
- id: 211403
  name: 高度温差
  text: 角色触发融化反应造成的伤害提升30%
- id: 211501
  name: 风之祝祷·火
  text: 角色触发扩散反应造成的伤害提升80%，星扩散反应造成的伤害提升8%，角色的攻击力提升9%。
- id: 211502
  name: 焚风
  text: 当前场上角色的攻击对敌人造成伤害时，将消耗该角色的生命值释放，基于风之祝祷·火的层数计算伤害，造成火元素范围伤害
- id: 211503
  name: 炽岚
  text: 队伍中的火元素或风元素角色登场时，将根据该角色的元素类型释放，基于风之祝祷·火的层数，造成对应元素类型的范围伤害
- id: 211601
  name: 寒意
  text: 队伍中所有冰元素和水元素角色的暴击伤害提升40%
- id: 211602
  name: 寒水震波
  text: 当前场上的冰元素角色对敌人触发冻结反应后释放，造成水元素范围伤害
- id: 211603
  name: 冽冰震波
  text: 当前场上的水元素角色对敌人触发冻结反应后释放，造成冰元素范围伤害
- id: 211604
  name: 冰裂
  text: 敌人的水元素与冰元素抗性降低8%，至多叠加3层
- id: 211701
  name: 低阻
  text: 敌人的冰元素和雷元素抗性降低5%，物理抗性降低10%，至多叠加6层
- id: 211702
  name: 涌现震波
  text: 角色对处于低阻效果影响下的敌人造成物理伤害后释放，造成物理伤害，每3秒至多触发一次
- id: 211801
  name: 水晶庇佑
  text: 使队伍中所有角色获得70%水元素与岩元素伤害加成，月结晶反应造成的伤害提升75%。此外，每4秒，将获取附近的结晶反应产生的晶片
- id: 211802
  name: 岩晶轰袭
  text: 水晶庇佑效果持续期间，将间歇性在角色的位置释放，造成岩元素范围伤害
- id: 211803
  name: 涧石
  text: 水晶庇佑效果持续期间，队伍中水元素或岩元素角色受到治疗时，将在敌人的位置降下，造成岩元素伤害
- id: 211804
  name: 寒冰荆棘
  text: 每2秒对周围敌人各造成一次冰元素和草元素范围伤害，场上最多同时存在两根寒冰荆棘
- id: 211805
  name: 电气蔓棘
  text: 寒冰荆棘范围内，角色的雷元素攻击命中敌人后，寒冰荆棘将转化为一根存在10秒的电气蔓棘，攻击频率提升至每秒1次，且造成1.5倍雷元素范围伤害
- id: 211806
  name: 磁化荆棘
  text: 不具有攻击效果，使附近的敌人受到角色的冰元素、草元素、雷元素以及物理攻击伤害提升。场上每存在一根磁化荆棘，将获得45%的上述提升效果，至多提升90%
- id: 211901
  name: 风之祝祷·冰
  text: 角色触发扩散反应造成的伤害提升80%，星扩散反应造成的伤害提升8%，角色的暴击伤害提升16%
- id: 211902
  name: 肃蚀
  text: 风之祝祷·冰持续期间，角色的攻击命中敌人时施加，基于风之祝祷·冰的层数间歇性造成冰元素伤害
- id: 211903
  name: 冰岚
  text: 风之祝祷·冰持续期间，角色冲刺时释放，牵引附近的敌人，并基于风之祝祷·冰的层数造成风元素伤害
- id: 10050001
  name: 额外强化效果
  text: |-
    每与一种元素进行过共鸣，旅行者便会获得对应的属性提升：
    风元素：暴击率提升10%；
    岩元素：防御力提升20%；
    雷元素：元素充能效率提升20%；
    草元素：元素精通提升60点；
    水元素：生命值提升20%；
    火元素：攻击力提升20%；
    冰元素：暴击伤害提升20%。
- id: 10050002
  name: 寒辉
  text: |-
    旅行者凝结的栗烈寒星发射冰晶命中敌人时，或解锁天赋异邦的层冰后进行重击·冰凝后，将会获得的特殊效果。该效果至多叠加8层。
    施放元素爆发聚冰成锋时，旅行者会消耗所有的寒辉层数，提升本次元素爆发造成的伤害。若消耗层数为8层，则还会提升本次元素爆发造成伤害的段数。
- id: 11120001
  name: 低温冷藏模式
  text: |-
    点按
    以「低温冷藏」模式启动全频谱多重任务厨艺机关，对周围的敌人造成冰元素范围伤害。

    厨艺机关·低温冷藏模式
    将跟随当前场上角色，并将间歇性对附近的敌人发射「冻霜芭菲」，造成冰元素伤害。
- id: 11120002
  name: 即兴烹饪模式
  text: |-
    厨艺机关·即兴烹饪模式
    ·在场上放置厨艺机关。厨艺机关可以吸收元素攻击。吸收的元素能量达到临界值时，将使爱可菲事先放入其中的食材转化为美食。
    ·爱可菲需要时间采购新的食材，每周只能通过这种方式制作一定数量的料理。制作料理的次数每周一凌晨4点重置。
- id: 11130001
  name: 援护射击
  text: |-
    在夜魂加持状态下，伊法的普通攻击将会转为进行援护射击。
    点按
    发射秘药弹。
    长按
    持续发射秘药弹。
    秘药弹
    造成具有夜魂性质的风元素伤害，并在命中敌人时为队伍中附近的所有角色恢复生命值，回复量受益于伊法自己的元素精通。
- id: 11130002
  name: 救援要义
  text: 上限为150点。基于伊法持有的救援要义，每1点救援要义会使队伍中附近的角色触发的扩散反应与感电反应造成的伤害提升1.5%，月感电反应造成的伤害提升0.2%，星扩散反应造成的伤害提升0.2%。救援要义将在伊法的夜魂加持结束时被移除。
- id: 11130003
  name: 夜魂加持·伊法
  text: |-
    持续消耗夜魂值。夜魂值耗尽时，或是再次施放时，伊法的夜魂加持将会结束。夜魂加持状态具有如下特性：
    ·在咔库库的帮助下悬浮，提升伊法的移动速度与抗打断能力，在这种状态下，伊法将持续消耗夜魂值，维持悬浮状态，进行冲刺或抬升高度时，将额外消耗夜魂值。
    ·进行普通攻击时，将依据点按、长按，转为以不同的方式进行「援护射击」。
- id: 11130004
  name: 镇静标记
  text: 该效果会在片刻后爆发消失，并造成对应元素属性的范围伤害。至多对4名命中的敌人施加「镇静标记」；敌人无法同时处于多种元素属性的「镇静标记」状态下。
- id: 11130005
  name: 蛇之狡谋
  text: |-
    丝柯克可以消耗蛇之狡谋，以维持七相一闪模式，或是施放元素爆发极恶技·灭。

    丝柯克可以通过以下方式获得蛇之狡谋：
    ·施放元素战技极恶技·闪后；
    ·触发突破天赋理外之理中汲取虚境裂隙的效果后。

    丝柯克在七相一闪模式下退场时，或七相一闪模式结束时，将移除丝柯克持有的蛇之狡谋。
- id: 11130006
  name: 七相一闪
  text: |-
    施放元素战技极恶技·闪时，丝柯克将在一段时间内切换至该模式，并具有如下特性：
    ·持续消耗蛇之狡谋；
    ·提升普通攻击与重击的攻击范围，以及丝柯克的抗打断能力；
    ·进行普通攻击、重击和下落攻击时，将转为造成无法被附魔覆盖的冰元素伤害；
    ·元素爆发极恶技·灭将会被替换为特殊的元素爆发极恶技·尽；
    ·丝柯克进行冲刺时，能够在水面上移动；
    ·蛇之狡谋耗尽时，或持续时间结束时，丝柯克将退出该模式，并使元素战技进入冷却。
- id: 11130007
  name: 理外之理
  text: |-
    队伍中附近的角色对敌人触发冻结、超导、星超导、冰元素扩散、星扩散或冰元素结晶反应时，将在敌人附近创造一枚虚境裂隙。该效果每2.5秒至多触发一次，场上至多存在3枚丝柯克自己创造的虚境裂隙。

    丝柯克可以通过以下方式，汲取附近一定范围内的虚境裂隙：
    ·在七相一闪模式下进行的重击命中敌人时；
    ·施放七相一闪模式下的特殊元素爆发极恶技·尽时；
    ·长按施放元素战技极恶技·闪进行快速移动时。

    每汲取一枚虚境裂隙，丝柯克将获得8点蛇之狡谋。
- id: 11130008
  name: 万流归寂
  text: |-
    队伍中附近的元素类型为水元素的角色的水元素攻击命中敌人时，或是队伍中附近的元素类型为冰元素的其他角色的冰元素攻击命中敌人时，丝柯克将获得一层持续20秒的死河渡断效果，至多叠加3层，每层独立计算持续时间。
    每名角色至多通过这种方式使丝柯克获得1层死河渡断效果。
    每层死河渡断效果会使丝柯克在七相一闪模式下时进行的普通攻击造成原本110%/120%/170%的伤害，且施放的元素爆发极恶技·灭造成原本105%/115%/160%的伤害。
- id: 11130009
  name: 雾雨秘迹
  text: |-
    敌人或队伍中附近的角色接触到雾雨秘迹后，依据接触者的不同，将会产生不同的效果：
    若敌人接触到雾雨秘迹，雾雨秘迹将会发生爆炸，对周围的敌人造成水元素范围伤害；
    若队伍中附近的角色接触到雾雨秘迹，雾雨秘迹会将接触者高高弹起。

    同时只能存在一个由塔利雅自己创造的雾雨秘迹。
- id: 11130010
  name: 西风之眷
  text: |-
    塔利雅施放元素爆发纯耀的祷咏时，将会为队伍中自己的角色赋予该效果。
    持续期间，圣眷护盾在效果结束时，或因伤害破碎时，塔利雅可以消耗一层祝颂效果，重新唤出圣眷护盾。
- id: 11130011
  name: 祝颂
  text: |-
    塔利雅可以通过以下方式获得祝颂效果：
    ·队伍中自己的当前场上角色处于西风之眷效果影响下时，普通攻击每命中敌人4次，塔利雅将获得X层祝颂效果；
    ·触发突破天赋风色柔愿的眷宠的效果后。

    每次西风之眷效果持续期间，塔利雅至多获得X层祝颂效果。
- id: 11160001
  name: 薇尔琪塔
  text: |-
    与伊涅芙一同战斗的好帮手，可以通过施放元素战技或元素爆发召唤至场上。
    若周围存在敌人，每隔2秒，薇尔琪塔将快速移动至一名敌人附近，对其进行放电攻击，造成雷元素范围伤害。
    同时至多存在一个伊涅芙自己创造的薇尔琪塔。

    此外，在挪德卡莱，似乎可以通过某种途径来改变薇尔琪塔的外观…
- id: 11190001
  name: 霜林圣域
  text: |-
    用以护守咏月使的术阵，通过施放元素战技圣言述咏·终宵永眠唤出。
    霜林圣域将跟随当前场上角色，每2秒对术阵中的敌人造成一次草元素范围伤害，该伤害视为元素战技伤害。
- id: 11190002
  name: 月咏
  text: |-
    用以纺出祷歌的乐节，可以在施放元素爆发时或施放元素爆发后的一段时间内转化为提升绽放、超绽放、烈绽放、月绽放反应伤害的苍色祷歌。
    菈乌玛消耗草露以长按施放元素战技圣言述咏·终宵永眠时，依据消耗的草露数，每一枚草露都会使菈乌玛获得一层「月咏」。
- id: 11190003
  name: 苍色祷歌
  text: |-
    咏月使世代传承的祷歌，能够提升绽放、超绽放、烈绽放、月绽放反应造成的伤害。

    菈乌玛可以通过以下方式获得苍色祷歌：
    ·施放元素爆发圣言述咏·众心为月时；
    ·触发元素爆发圣言述咏·众心为月中消耗「月咏」的效果时；
    ·触发命之座「我愿将这血与泪奉予月明」中霜林圣域的效果时。

    队伍中的角色造成绽放、超绽放、烈绽放、月绽放反应伤害时，将消耗一层「苍色祷歌」，提升造成的伤害，提升值基于菈乌玛的元素精通。上述伤害同时命中多名敌人时，会依据命中敌人的数量消耗「苍色祷歌」层数。
    每层「苍色祷歌」独立计算持续时间。
- id: 11190004
  name: 宵色夜咏
  text: 队伍中的角色触发的绽放、超绽放、烈绽放反应造成的伤害能够造成暴击，暴击率固定为15%，暴击伤害固定为100%。该效果提供的暴击率可以与使对应元素反应能够造成暴击的同类效果提供的暴击率叠加。
- id: 11190005
  name: 月华圣咏
  text: 队伍中的角色造成的月绽放反应伤害，暴击率提升10%，暴击伤害提升20%。
- id: 11190007
  name: 擢升
  text: 特殊的伤害提升效果，与其他的伤害提升效果分别独立计算。
- id: 11190008
  name: 草露
  text: |-
    队伍中的角色触发月绽放反应后，会为队伍提供的资源。
    触发月绽放反应后的2.5秒内，每2.5秒便会为队伍提供一枚草露，草露上限为三枚。持续期间，再次触发月绽放反应时，将刷新上述效果的持续时间。
- id: 11200001
  name: 雷霆交响
  text: |-
    消耗更少的元素能量便可以施放的特殊元素爆发。菲林斯造成一次视为月感电反应伤害的雷元素范围伤害。
    月兆·满辉：若附近存在雷暴云，还会额外造成一次视为月感电反应伤害的雷元素范围伤害。
- id: 11220001
  name: 影舞
  text: |-
    施放元素战技弈术·千夜一舞后，奈芙尔将会进入该状态。
    处于「影舞」状态下时，若拥有至少1枚草露，奈芙尔施放的重击将会被替换为特殊的重击「幻戏」。
    「影舞」状态将在奈芙尔施放3次幻戏或持续时间结束时解除。
- id: 11220002
  name: 幻戏
  text: |-
    处于元素战技弈术·千夜一舞造成的「影舞」状态下时，若拥有至少1枚草露，奈芙尔施放的重击将会被替换为特殊的、不消耗体力的重击「幻戏」。
    奈芙尔召唤出自身的虚影，对敌人发起协同攻击，自身与虚影分别依次造成2/3段草元素范围伤害。虚影造成的伤害视为月绽放反应伤害，每次施放幻戏后首次召唤虚影时，将消耗一枚草露。
- id: 11220003
  name: 伪秘之帷
  text: |-
    奈芙尔通过突破天赋「月下的豪赌」吸收诳言之核后获得的效果，可以提升幻戏造成的伤害。
    每层「伪秘之帷」都会使奈芙尔施放的幻戏造成比原本高8%的伤害，初始至多叠加3层，持续9秒，每层独立计算持续时间。
- id: 11230001
  name: 精质转变
  text: |-
    杜林施放元素战技二元式·聚分熔炼后获得的效果，持续6秒。
    持续期间，杜林可以通过点按元素战技进入白化之是状态，或是通过点按普通攻击进入黑度之否状态。
    在两种状态下，杜林会获得不同的强化效果，并可以分别施放不同的元素爆发。
- id: 11240001
  name: 呼噜噜秘藏瓶
  text: |-
    雅珂达施放元素战技奇策·财富分配方案后取出的小型元素瓶。
    雅珂达处于「掠影追袭」状态下时，若附近的敌人处于火元素、水元素、雷元素或冰元素附着下，呼噜噜秘藏瓶会转化为对应的元素类型，并持续进行装填，且会按照火元素、水元素、雷元素、冰元素的优先级进行转化。每次施放元素战技后，呼噜噜秘藏瓶至多能进行一次转化。
    呼噜噜秘藏瓶装满时，雅珂达将会退出「掠影追袭」状态，对附近的敌人造成一次风元素伤害，并清空呼噜噜秘藏瓶。
    每次施放元素战技时，雅珂达都会重新取出一个新的呼噜噜秘藏瓶。

    月兆·满辉：呼噜噜秘藏瓶装满时，雅珂达不会立刻清空呼噜噜秘藏瓶，而是会在接下来的一段时间内，持续消耗瓶中装填的元素，并间歇性向附近的敌人发射软绒绒猫猫球，造成呼噜噜秘藏瓶对应元素类型的伤害。
- id: 11240002
  name: 猫型家用互助协调器
  text: |-
    曾是宝藏猎人的雅珂达随身携带的小道具之一，施放元素爆发秘器·猎人的七道具后取出。
    猫型家用互助协调器将会持续为队伍中自己的当前场上角色恢复生命值；如果受到治疗的角色生命值高于70%，还会同时为队伍中附近生命值最低的角色恢复生命值。

    月兆·满辉：若附近的敌人处于火元素、水元素、雷元素或冰元素附着下，猫型家用互助协调器将会转化为对应的元素类型，并会按照火元素、水元素、雷元素、冰元素的优先级进行转化。每次取出猫型家用互助协调器后，至多通过这种方式进行一次元素转化。触发元素转化后，猫型家用互助协调器将会间歇性攻击附近至多3名敌人，造成对应元素伤害。
- id: 11250001
  name: 引力涟漪
  text: |-
    施放元素战技万古潮汐后，哥伦比娅将唤出引力涟漪。
    引力涟漪将跟随当前场上角色，并持续对周围的敌人造成水元素范围伤害。

    此外，引力涟漪存在期间，队伍中附近的角色触发月曜反应时，或造成月曜反应伤害时，哥伦比娅将在接下来的2秒内获得新月之示效果，持续积攒引力值，每2秒可以积攒20点引力值。
    引力值上限为60点，且会在引力涟漪持续时间结束时被移除。
    当引力值积攒至上限时，将触发特殊的引力干涉，依据为哥伦比娅积攒最多引力值的月曜反应类型，分别产生不同的效果。若为哥伦比娅积攒最多引力值的月曜反应类型为：
    ·月感电反应：引力干涉将造成一次雷元素范围伤害，该伤害视为月感电反应伤害；
    ·月绽放反应：引力干涉将对周围的敌人发射5枚月露之印，造成草元素伤害，该伤害视为月绽放反应伤害；
    ·月结晶反应：引力干涉将造成一次岩元素范围伤害，该伤害视为月结晶反应伤害。
- id: 11250002
  name: 月之领域
  text: |-
    施放元素爆发她的乡愁后，哥伦比娅唤出的领域。
    当前场上角色处于月之领域中时，队伍中的所有角色造成的月曜反应伤害将会提升。
- id: 11250003
  name: 山月草露
  text: |-
    由哥伦比娅的固有天赋新月自己的法则提供的、特殊的草露资源，与草露分别计算上限与持续时间。
    队伍拥有的草露耗尽时，将转而消耗山月草露。
    山月草露上限为三枚。
- id: 11260001
  name: 月转时隙
  text: |-
    施放元素战技天地忽然身后，兹白将切换至该模式。该模式至多持续15秒，并具有以下特性：
    ·进行普通攻击与重击时，将转为造成无法被附魔覆盖的岩元素伤害；
    ·元素战技天地忽然身将会被替换为特殊的元素战技灵驹飞踏：当兹白拥有至少70点「时隙浮光」时，兹白可以消耗70点「时隙浮光」，施放灵驹飞踏，造成两次岩元素伤害，其中的第二段伤害视为月结晶反应伤害。

    「时隙浮光」上限为100点，兹白可以通过以下方式积攒「时隙浮光」：
    ·处于「月转时隙」模式下时，每秒积攒10点「时隙浮光」；
    ·普通攻击命中敌人时，会积攒5点「时隙浮光」，每0.5秒至多通过这种方式为兹白积攒一次「时隙浮光」。

    月兆·满辉
    队伍中附近的角色触发月结晶反应时，也会为兹白积攒35点「时隙浮光」，每4秒至多通过这种方式为兹白积攒一次「时隙浮光」，施放特殊元素战技灵驹飞踏将会重置通过这种方式积攒「时隙浮光」的冷却时间。

    施放4次灵驹飞踏后，或持续时间结束时，兹白将退出该模式。
- id: 11270001
  name: 「夜莺之歌」
  text: 叶洛亚施放元素爆发鉴照无影后获得的效果，可以提升当前场上角色造成的岩元素伤害。
- id: 11280001
  name: 狂飙突进
  text: |-
    点按施放元素战技烈风终坠后，法尔伽将切换至该模式。
    处于该模式下时，法尔伽的普通攻击与重击造成的伤害提高，无法进行下落攻击；法尔伽进行普通攻击与重击时，将根据队伍中角色的元素类型，使双持的大剑分别造成无法被附魔覆盖的对应元素伤害：
    ·左手持握的大剑将转为造成无法被附魔覆盖的风元素伤害；
    ·队伍中存在火元素、水元素、雷元素或冰元素角色时，右手持握的大剑将按照上述元素类型的优先级，造成无法被附魔覆盖的对应元素伤害。

    此外，处于该模式下时，若队伍中存在火元素、水元素、雷元素或冰元素角色，法尔伽的元素战技烈风终坠将会被替换为特殊的元素战技四风将起。
- id: 11280002
  name: 四风将起
  text: |-
    法尔伽的特殊元素战技，对敌人造成无法被附魔覆盖的右手持握大剑的对应元素范围伤害与风元素范围伤害。
    初始处于冷却，至多拥有2次可使用次数。
    法尔伽在狂飙突进模式下的普通攻击命中敌人时，四风将起的冷却时间将会缩短0.5秒；每次切换至狂飙突进模式后，该效果至多触发15次。
    此外，法尔伽可以消耗四风将起的可使用次数，进行不消耗体力的特殊重击苍噬，造成2次无法被附魔覆盖的右手持握大剑的对应元素伤害与2次风元素伤害。
- id: 11290001
  name: 奇谋
  text: |-
    施放元素战技奇兵诡出后，洛恩将会切换至该状态。奇谋状态具有如下特性：
    ·洛恩的普通攻击、重击与下落攻击将转为造成无法被附魔覆盖的冰元素伤害；
    ·洛恩的普通攻击或重击命中敌人时，会为洛恩积攒特殊的欢悦，用于施放特殊元素战技镂骨彻心；在奇谋状态下至多施放3次镂骨彻心，之后无法获得欢悦。
    ·队伍中附近的其他角色造成伤害时，会为洛恩积攒特殊的争胜，用于提升特殊元素战技镂骨彻心造成的伤害；
    ·洛恩退场时，奇谋状态将会解除；奇谋状态解除时，欢悦与争胜也会清除。
- id: 11290002
  name: 镂骨彻心
  text: |-
    洛恩的欢悦积攒至上限后，可以施放的特殊元素战技。
    命中敌人后消耗所有欢悦与争胜，造成冰元素伤害，并依据消耗的争胜，提升本次伤害。
- id: 11290003
  name: 欢悦
  text: |-
    在奇谋状态下，洛恩的普通攻击或重击命中敌人时，会获得17点欢悦，上限为100点。
    每0.1秒至多获得一次欢悦。欢悦积攒至上限后，洛恩的元素战技奇兵诡出将会被替换为特殊的元素战技镂骨彻心。
- id: 11290004
  name: 争胜
  text: |-
    在奇谋状态下，队伍中附近的其他角色造成伤害时，会为洛恩提供的特殊资源，上限为100点。
    奇谋状态持续期间，队伍中附近的其他角色造成伤害时，若本次伤害不低于洛恩基础攻击力的1000%，将会为洛恩积攒20点争胜，否则会为洛恩积攒1点争胜。
    同一个角色每0.1秒至多为洛恩积攒一次争胜。
- id: 11300001
  name: 露米·出击形态
  text: |-
    露米有三种不同的出击形态。

    超厉害形态
    露米会使用捶捶乱打不断攻击附近的敌人，每次攻击会造成2次岩元素范围伤害。
    若附近存在月笼，露米则会交替使用捶捶乱打与加力重锤，不断攻击附近的敌人；加力重锤会造成视为月结晶反应伤害的岩元素范围伤害。

    究极厉害形态
    露米会使用究极厉害的百万吨重锤，对附近的敌人造成一次格外强力的、视为月结晶反应伤害的岩元素范围伤害，并切换至普通厉害形态。

    普通厉害形态
    虽然没有其他形态那么厉害，但也很厉害。
    露米会以更长的间隔使用捶捶乱打，不断攻击附近的敌人，每次攻击会造成2次岩元素范围伤害。
- id: 11310001
  name: 虚己之赐
  text: |-
    施放元素战技圣言默示·未现之光后，尼可会为队伍中附近的所有角色赋予该效果：基于尼可的攻击力，提升攻击力。
    满足特定条件后，虚己之赐效果将会升变为圣祝之引，进一步提升攻击力。
- id: 11310002
  name: 圣祝之引
  text: |-
    虚己之赐升变后的效果，能额外提升300点攻击力。
    解锁突破天赋「分有」并满足其中的任意「观测」条件后，虚己之赐将会在剩余持续时间内升变为圣祝之引：
    ·受观测的其他角色持续处于场上超过3秒；
    ·受观测的其他角色为魔导角色。

    此外，解锁突破天赋「慕善」后，队伍中附近的当前场上角色的元素伤害命中敌人后，尼可自己拥有的虚己之赐也会升变为圣祝之引，持续8秒。

    除尼可外，其他角色拥有的圣祝之引将在退场时还原为虚己之赐。
- id: 11320001
  name: 狩灾誓锤
  text: |-
    值得信任的追猎魔女好伙伴！在一定条件下可以发生元素转化，所有原本由「狩灾誓锤」造成的伤害，都会转为对敌人造成对应元素类型的伤害。
    布伦妮可以通过以下方式，召唤出发生元素转化的「狩灾誓锤」：
    ·布伦妮施放元素战技叮铃铃·猎魔之音对敌人触发扩散或星扩散反应后的一定时间内，可以施放特殊的元素战技咚锵锵·裁魔之惩；施放该特殊元素战技时，「狩灾誓锤」将会转化为参与先前扩散或星扩散反应的其他元素类型。
    ·解锁突破天赋「裁断追惩」后，如果处于「寻猎」模式下的「诱巫饵铃」对敌人触发了扩散或星扩散反应，则会召唤出一柄依据本次扩散或星扩散反应进行元素转化的「狩灾誓锤」对敌人进行攻击。
- id: 11320002
  name: 裁断追惩
  text: 元素爆发铃鸣·狩魔之刻中，处于「寻猎」模式下的「诱巫饵铃」对敌人造成伤害后，若该次伤害对敌人触发了扩散反应，则还会在敌人面前召唤出一柄依据本次扩散反应进行元素转化的「狩灾誓锤」向其砸下，造成对应类型的元素伤害，该伤害视为元素爆发伤害。
- id: 11320003
  name: 振铃同心
  text: 当布伦妮使用发生过元素转化的「狩灾誓锤」命中敌人后，队伍中附近的其他角色将获得「振铃鼓舞」效果：基于布伦妮的攻击力，提升攻击造成的伤害。
- id: 11330001
  name: 解算
  text: |-
    进行重击时，法洁欧将会切换至该模式。
    处于该模式下时，法洁欧会对前方的敌人进行扫射攻击，并周期性发射冷凝射线，造成冰元素范围伤害。
    辉映·星烁：冷凝射线转为造成视为对应星烁反应伤害的冰元素范围伤害。
- id: 11330002
  name: 解算功率
  text: 处于解算模式下时，法洁欧的解算功率会不断上升；解算功率达到上限时，将无法维持或重新进入解算模式。
- id: 11330003
  name: 极星辉域
  text: 触发星超导反应时，附近的区域会短暂变化为极星辉域；处于极星辉域中时，特定角色将会进入辉映·星超导状态，使其不同技能分别获得对应的强化效果。
- id: 11400001
  name: 领唱
  text: |-
    队伍中自己的当前场上角色的普通攻击、重击、下落攻击、元素战技或元素爆发造成水元素伤害或冰元素伤害时，将消耗一层「领唱」，提升造成的伤害；若当前场上存在流荡风旋，或处于流荡风旋引爆后的5秒内，则改为角色造成星扩散反应伤害时才会触发上述效果。
    基于沃雅妮莎生命值上限超过40000的部分，每1000点生命值上限都会使上述效果中的星扩散反应伤害提升260点，水元素伤害与冰元素伤害提升140点；通过这种方式，至多使星扩散反应伤害提升6500点，水元素伤害与冰元素伤害提升3500点。
- id: 11400002
  name: 重唱
  text: 由队伍中后台角色或队伍中附近的其他角色（而非队伍中自己的当前场上角色）触发，效果与「领唱」一致。
- id: 11430001
  name: 巡风列装
  text: |-
    施放元素战技操典·制胜有道后，薇斯纳将切换至该模式。该模式至多持续15秒，并具有如下特性：
    ·提升薇斯纳的抗打断能力。
    ·薇斯纳进行普通攻击、重击与下落攻击时，将转为造成无法被附魔覆盖的风元素伤害，并唤出风翎协同攻击敌人，造成额外的风元素伤害；每次唤出风翎时，都会为薇斯纳恢复一定的剑气。
    ·薇斯纳可以消耗剑气，施放特殊的元素战技翔风剑，对敌人造成风元素伤害。
    ·持续时间结束时，或施放三次最高境界的翔风剑后，薇斯纳将退出该模式，并清除所有剑气。
- id: 11430002
  name: 剑气
  text: |-
    用于在巡风列装模式下施放特殊元素战技翔风剑的能量。
    薇斯纳可以通过以下方式积攒剑气：
    ·在巡风列装模式下，进行普通攻击、重击、下落攻击，或施放命之座「不移的赤忱」中的翔风剑·变移；
    ·施放元素战技操典·制胜有道；
    ·施放元素爆发致礼·献予女皇陛下。
- id: 11430003
  name: 翔风剑
  text: |-
    在巡风列装模式下，薇斯纳可以消耗剑气，施放该特殊元素战技，造成风元素伤害。
    每次施放特殊元素战技翔风剑后，本次巡风列装模式持续期间，其境界都会提升；翔风剑的初始境界为一阶，至多提升至三阶。
    施放境界提升后的翔风剑时，还会唤出灵剑，对敌人造成风元素伤害。
- id: 11430004
  name: 灵剑
  text: |-
    薇斯纳召唤出的灵体武器，会协同薇斯纳对敌人进行攻击，造成风元素伤害。
    薇斯纳可以通过以下方式召唤出灵剑：
    ·施放境界提升的特殊元素战技翔风剑；
    ·施放元素爆发致礼·献予女皇陛下；
    ·施放命之座「不移的赤忱」中的翔风剑·变移。

    辉映·星扩散：灵剑转为造成视为星扩散反应伤害的风元素伤害。
- id: 11480001
  name: 弋猎印记
  text: |-
    阿罗夏向敌人施加的特殊效果。
    对已经处于弋猎印记影响下的敌人再次施加该效果时，将会改为激活弋猎印记：移除该印记，并使队伍中附近的所有角色获得猎者之准效果：处于场上时，攻击力提升。
- id: 11480002
  name: 图加林
  text: 深受阿罗夏信赖的猎犬伙伴，可以通过施放元素爆发守猎进踞召唤至场上，会间歇性快速移动至一名敌人附近，对其进行撕咬攻击，并激活已有的弋猎印记。
- id: 11500001
  name: 独舞倒影
  text: |-
    与奥黛塔一同起舞的心象倒影，可以通过施放元素战技或元素爆发召唤至场上。
    会交替呈现拂羽与旋翼两种舞步，以优雅轻盈的舞姿间歇性攻击附近的敌人，造成冰元素范围伤害。
    同时至多存在一个奥黛塔自己创造的独舞倒影。

    此外，附近存在奥黛塔自己召唤的独舞倒影时，奥黛塔的元素战技柔板·幻灵夜舞将会被替换为特殊的元素战技柔板·破晓终奏。
- id: 11500002
  name: 柔板·破晓终奏
  text: |-
    奥黛塔的特殊元素战技，对附近的敌人持续造成冰元素范围伤害，并在共舞结束时，造成一次视为星超导反应伤害的冰元素范围伤害。共舞时，奥黛塔可以控制舞步的方向。
    辉映·星烁：共舞结束时，改为造成一次视为对应星烁反应伤害的冰元素范围伤害。

    此外，施放特殊元素战技柔板·破晓终奏后，在独舞倒影剩余持续时间内，若奥黛塔处于辉映·星烁状态，则独舞倒影的两种舞步还会额外造成视为对应星烁反应伤害的冰元素范围伤害。
- id: 11500003
  name: 华彩
  text: |-
    解锁突破天赋「获选者的春祭」后，奥黛塔召唤独舞倒影时将会获得的特殊效果。
    每层华彩都会使角色造成的星烁反应伤害提升15%，持续至独舞倒影退场或重新召唤独舞倒影。
    当奥黛塔处于队伍后台时，奥黛塔每秒会清除1层华彩，并使队伍中附近的其他角色获得对应层数的华彩。
- id: 11500004
  name: 辉映·星烁
  text: |-
    辉映·星超导与辉映·星扩散统称为辉映·星烁状态。
    角色同时只能受到一种辉映状态影响，且优先被辉映·星超导影响。
