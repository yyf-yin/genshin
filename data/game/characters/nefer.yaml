passives:
- name: 月下的豪赌
  description: |-
    依据队伍的月兆，奈芙尔将获得对应的强化效果。

    月兆·满辉：施放元素战技**弈术·千夜一舞**时，将使当前场上的草原核转化为「诳言之核」，且附近所有角色在接下来的15秒内触发月绽放反应时，将取代草原核与丰穰之核产生诳言之核。诳言之核无法触发超绽放与烈绽放反应，也无法迸发。
    奈芙尔施放重击或**幻戏**时，可以吸收附近一定范围内的诳言之核，每吸收一枚诳言之核，奈芙尔便会获得一层**「伪秘之帷」**效果；该效果叠加至3层或3层的持续时间刷新时，奈芙尔的元素精通提升100点，持续8秒。
- name: 尘沙的女儿
  description: 奈芙尔处于**「影舞」**状态下时，队伍中的角色触发月绽放反应后的5秒内，奈芙尔的**蛇行**状态还会额外为队伍提供**草露**；依据奈芙尔的元素精通超过500的部分，每100点元素精通都将使上述提供草露的效果提升10%，至多通过这种方式提升50%。
- name: 月兆祝赐·廊下暮影
  description: |-
    队伍中的角色触发绽放反应时，将转为触发月绽放反应，且基于奈芙尔的元素精通，提升队伍中角色造成的月绽放反应的基础伤害：每点元素精通都将提升0.0175%月绽放反应的基础伤害，至多通过这种方式提升14%伤害。

    此外，奈芙尔在队伍中时，队伍的月兆将会上升一级。
- name: 金室的密谋
  description: 在挪德卡莱执行时长为20小时的探索派遣任务时，获得的奖励增加25%。
constellations:
  c1:
    name: 谋篇乃成败之始
    description: 奈芙尔的**幻戏**造成的月绽放反应伤害的基础伤害提升，提升值相当于奈芙尔的元素精通的60%。该效果同样会受到**「伪秘之帷」**的加成。
  c2:
    name: 明察为筹算之先
    description: |-
      突破天赋**「月下的豪赌」**的效果获得强化：**「伪秘之帷」**的持续时间延长5秒，上限提升至5层，且至多使**幻戏**造成原本140%的伤害；奈芙尔施放元素战技**弈术·千夜一舞**时，将立刻获得2层「伪秘之帷」。此外，「伪秘之帷」叠加至5层或5层的持续时间刷新时，奈芙尔的元素精通改为提升200点，持续8秒。
      需要解锁突破天赋「月下的豪赌」。
  c3:
    name: 诳言掩虚实之迹
    description: |-
      元素战技**弈术·千夜一舞**的技能等级提高3级。
      至多提升至15级。
  c4:
    name: 眩惑入谜局之网
    description: |-
      奈芙尔在场上且处于**「影舞」**状态下时，获取草露的速度提升25%。
      此外，奈芙尔处于「影舞」状态下时，还会使附近敌人的草元素抗性降低20%，当奈芙尔不处于「影舞」状态或离开敌人一定距离后，该效果会在4.5秒后移除。
  c5:
    name: 见机在忽微之间
    description: |-
      元素爆发**圣约·真眸幻戏**的技能等级提高3级。
      至多提升至15级。
  c6:
    name: 决胜于逆转之时
    description: "奈芙尔施放**幻戏**时，自身的第二段伤害将转为造成相当于奈芙尔元素精通85%的草元素范围伤害；此外，幻戏的攻击结束时，还会造成一次相当于奈芙尔元素精通120%的草元素范围伤害。上述伤害均视为由幻戏造成的月绽放反应伤害。\n\n月兆·满辉 \n奈芙尔造成的月绽放反应伤害**擢升**15%。"
upgrades:
- slot: 固有天赋
  name: 金室的密谋
  description: 此外，作为「秘闻馆」的主人，奈芙尔似乎可以通过某种方式获取各方的情报，而那夏镇的某些势力似乎对这些情报很有兴趣…
terms:
- id: 11190007
  name: 擢升
  text: 特殊的伤害提升效果，与其他的伤害提升效果分别独立计算。
- id: 11190008
  name: 草露
  text: |-
    队伍中的角色触发月绽放反应后，会为队伍提供的资源。
    触发月绽放反应后的2.5秒内，每2.5秒便会为队伍提供一枚草露，草露上限为三枚。持续期间，再次触发月绽放反应时，将刷新上述效果的持续时间。
- id: 11220001
  name: 影舞
  text: |-
    施放元素战技弈术·千夜一舞后，奈芙尔将会进入该状态。
    处于「影舞」状态下时，若拥有至少1枚草露，奈芙尔施放的重击将会被替换为特殊的重击「幻戏」。
    「影舞」状态将在奈芙尔施放3次幻戏或持续时间结束时解除。
- id: 11220002
  name: 幻戏
  text: |-
    处于元素战技弈术·千夜一舞造成的「影舞」状态下时，若拥有至少1枚草露，奈芙尔施放的重击将会被替换为特殊的、不消耗体力的重击「幻戏」。
    奈芙尔召唤出自身的虚影，对敌人发起协同攻击，自身与虚影分别依次造成2/3段草元素范围伤害。虚影造成的伤害视为月绽放反应伤害，每次施放幻戏后首次召唤虚影时，将消耗一枚草露。
- id: 11220003
  name: 伪秘之帷
  text: |-
    奈芙尔通过突破天赋「月下的豪赌」吸收诳言之核后获得的效果，可以提升幻戏造成的伤害。
    每层「伪秘之帷」都会使奈芙尔施放的幻戏造成比原本高8%的伤害，初始至多叠加3层，持续9秒，每层独立计算持续时间。
