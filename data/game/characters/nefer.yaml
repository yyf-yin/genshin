version: '6.1'
intro: |-
  奈芙尔是一位可以使队伍中的角色能触发月绽放反应，并通过消耗月绽放反应产生的草露，造成月绽放伤害的草元素输出型角色。
  奈芙尔施放元素战技后，会进入特殊的「影舞」状态；处于这种状态下时，奈芙尔可以消耗草露，长按普通攻击进行「幻戏」，对敌人造成大量月绽放伤害。
  此外，队伍的月兆等级为满辉时，奈芙尔的元素战技还会使附近的草原核与丰穰之核转化为「诳言之核」，通过蓄力重击，奈芙尔可以吸收附近的「诳言之核」，从而提升「幻戏」造成的伤害。
  奈芙尔的元素爆发会造成草元素范围伤害，若是先前吸收了「诳言之核」，元素爆发造成的伤害还会进一步提升。
