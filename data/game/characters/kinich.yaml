passives:
- name: 噩地的代价
  description: 处于夜魂加持状态下时，基尼奇的元素战技命中的敌人，将陷入「噩地」状态，在受到燃烧反应或烈绽放反应伤害时，为基尼奇产生7点夜魂值，每0.8秒至多通过这种方式产生一次夜魂值。噩地状态持续直至基尼奇此次夜魂加持状态结束。
- name: 焰灵的契约
  description: 队伍中的附近的角色触发「夜魂迸发」后，将为基尼奇赋予一层「猎人心得」，持续15秒，至多叠加2层。基尼奇在施放悬猎·游骋高狩的迴猎贯鳞炮时，将消耗所有的「猎人心得」，并依据消耗的层数，每层使本次迴猎贯鳞炮造成的伤害基于基尼奇攻击力的320%提高。
- name: 夜域赐礼·索报皆偿
  description: |-
    通过悬猎·游骋高狩，基尼奇进行空中摆荡后处于空中时，能够消耗10点燃素以再次进行空中摆荡。
    在纳塔存在燃素机制的区域时，能够进行夜魂传递·基尼奇。当前场上角色处于冲刺状态、特定天赋赋予的移动状态下，或是位于空中时，切换基尼奇登场时，基尼奇将依照条件，进行以下行动之一：
    ·朝向可以交互的卷叶符印时：向它发射钩索以进行移动；
    ·身边有敌人并处于战斗状态时：向该敌人施放悬猎·游骋高狩；
    否则，发射钩索，进行空中摆荡。基尼奇将优先以符合条件的卷叶符印为发射钩索的目标。
    自己的队伍每10秒能触发一次夜魂传递。

    在与卷叶符印等能够与匿叶龙交互的物件互动时，悬猎·游骋高狩将被替换为「匿叶仿生」，通过匿叶仿生与这些物件交互时，这些物件的交互规则沿袭匿叶龙的交互规则，并且不会使悬猎·游骋高狩进入冷却。
- name: 疾行的使令
  description: 在纳塔存在燃素机制的区域时，与部分采集物交互能够使队伍中自己的角色移动速度提高15%，持续10秒。此外，在小地图上显示周围的纳塔区域特产的位置。
