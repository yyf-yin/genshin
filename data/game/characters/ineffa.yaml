passives:
- name: 频率超限回路
  description: 若**「薇尔琪塔」**附近存在月感电反应产生的雷暴云，薇尔琪塔进行放电攻击时，将额外进行一次攻击，造成相当于伊涅芙攻击力65%的雷元素范围伤害，该伤害视为月感电反应造成的伤害。
