intro: |-
  布伦妮是一位能为队友提供伤害加成的风元素辅助型角色。
  施放元素战技，布伦妮将敲击「诱巫饵铃」造成风元素伤害；若该次攻击对敌人触发了扩散反应，则接下来一段时间内，之前参与扩散反应的元素将使「狩灾誓锤」发生元素转化，从而通过再次点按施放造成对应元素类型的伤害。
  施放元素爆发后，「诱巫饵铃」将进入「寻猎」模式，自动间歇性攻击周围的敌人，且解锁突破天赋裁断追惩后，若其攻击对敌人造成伤害并触发了扩散反应，还会在敌人面前召唤出一柄依据本次扩散反应进行元素转化的「狩灾誓锤」向其砸下，造成对应类型的元素伤害。
  在解锁突破天赋振铃同心后，布伦妮每次使用发生过元素转化的「狩灾誓锤」对敌人造成伤害后，队伍中附近的其他角色都会获得「振铃鼓舞」效果，提高其造成的伤害。
witch_quest: |-
  完成魔女的课业·辩驳之题后，布伦妮将成为魔导角色。队伍中编入至少2名魔导角色时，将获得魔导·秘仪效果，使魔导角色获得强化。

  魔导·秘仪
  队伍中处于「振铃鼓舞」效果影响下的魔导角色对敌人触发任意元素反应后，布伦妮自身的攻击力提高60%，持续5秒；若该角色触发的元素反应为扩散或星扩散反应，则其自身的攻击力还将额外提高30%，持续5秒。
