passives:
- name: 获选者的春祭
  description: 奥黛塔召唤**独舞倒影**时，还会获得4层**华彩**。
- name: 赤忱者的悲歌
  description: 基于奥黛塔攻击力超过1000点的部分，每100点攻击力都将使奥黛塔造成的星烁反应伤害额外造成原本1.5%的伤害，至多通过这种方式额外造成原本30%的伤害。
- name: 星耀祝礼·银晓之舞
  description: |-
    处于**极星辉域**中时/队伍中的角色在附近触发星扩散反应后的8秒内，奥黛塔将分别进入辉映·星超导/辉映·星扩散状态。
    队伍中的角色触发超导/冰元素扩散反应时，将转为触发星超导/星扩散反应，且基于奥黛塔的攻击力，提升队伍中角色造成的上述反应的基础伤害：每100点攻击力都将提升0.7%上述反应的基础伤害，至多通过这种方式提升14%伤害。
- name: 回响中的冬梦
  description: |-
    在小地图上显示周围的至冬区域特产的位置，在影域中亦能提供相同的佑助。
    在闲暇时练习舞蹈，或许还会触发其他的效果…
constellations:
  c1:
    name: 「不曾起舞的清晨，她望向倒影」
    description: |-
      施放特殊元素战技**柔板·破晓终奏**后，在共舞结束时，奥黛塔将对附近的敌人造成一次额外的冰元素范围伤害，该伤害视为：
      ·辉映·星超导或不处于辉映状态：相当于奥黛塔攻击力300%的星超导反应伤害；
      ·辉映·星扩散：相当于奥黛塔攻击力450%的星扩散反应伤害。

      此外，突破天赋「获选者的春祭」获得强化：召唤**独舞倒影**时，奥黛塔将额外获得2层**华彩**，且奥黛塔处于队伍后台时，清除华彩的速度提升至每秒2层。
  c2:
    name: 「她想，我要见证雪鹄未见之梦」
    description: |-
      突破天赋「获选者的春祭」获得强化：每层**华彩**还会使角色的攻击力提升7%。
      此外，**独舞倒影**在场时，若奥黛塔处于**辉映·星烁**状态，独舞倒影附近敌人的对应元素抗性还会降低20%：
      ·辉映·星超导：冰元素、雷元素；
      ·辉映·星扩散：冰元素、风元素。
  c3:
    name: 「我要追逐呼啸的风，向上独行」
    description: |-
      元素战技**柔板·幻灵夜舞**的技能等级提高3级。
      至多提升至15级。
  c4:
    name: 「向上，坠往恍惚、燃烧的蓝空」
    description: |-
      元素爆发疾板·苍羽一梦获得强化：奥黛塔获得雪鹄之梦时，还会使队伍中附近的其他角色造成的星烁反应伤害提升，提升值相当于雪鹄之梦效果的50%。

      此外，队伍中的角色对敌人造成星烁反应伤害时，奥黛塔还会对敌人进行一次协同攻击，造成一次冰元素范围伤害，每3.5秒至多触发一次，该伤害视为：
      ·辉映·星超导或不处于辉映状态：相当于奥黛塔攻击力66%的星超导反应伤害；
      ·辉映·星扩散：相当于奥黛塔攻击力99%的星扩散反应伤害。
  c5:
    name: 「看呀，我已告别尘与土的苦痛」
    description: |-
      元素爆发**疾板·苍羽一梦**的技能等级提高3级。
      至多提升至15级。
  c6:
    name: 「伸出手，触及苍穹永恒的面容」
    description: |-
      突破天赋「获选者的春祭」获得强化：奥黛塔赋予队伍中附近的所有角色**华彩**时，自己的华彩不再会减少。
      此外，处于华彩影响下的角色，对敌人造成的星烁反应伤害**擢升**25%，且奥黛塔对敌人造成的星烁反应伤害额外擢升20%。
terms:
- id: 11190007
  name: 擢升
  text: 特殊的伤害提升效果，与其他的伤害提升效果分别独立计算。
- id: 11330003
  name: 极星辉域
  text: 触发星超导反应时，附近的区域会短暂变化为极星辉域；处于极星辉域中时，特定角色将会进入辉映·星超导状态，使其不同技能分别获得对应的强化效果。
- id: 11500001
  name: 独舞倒影
  text: |-
    与奥黛塔一同起舞的心象倒影，可以通过施放元素战技或元素爆发召唤至场上。
    会交替呈现拂羽与旋翼两种舞步，以优雅轻盈的舞姿间歇性攻击附近的敌人，造成冰元素范围伤害。
    同时至多存在一个奥黛塔自己创造的独舞倒影。

    此外，附近存在奥黛塔自己召唤的独舞倒影时，奥黛塔的元素战技柔板·幻灵夜舞将会被替换为特殊的元素战技柔板·破晓终奏。
- id: 11500002
  name: 柔板·破晓终奏
  text: |-
    奥黛塔的特殊元素战技，对附近的敌人持续造成冰元素范围伤害，并在共舞结束时，造成一次视为星超导反应伤害的冰元素范围伤害。共舞时，奥黛塔可以控制舞步的方向。
    辉映·星烁：共舞结束时，改为造成一次视为对应星烁反应伤害的冰元素范围伤害。

    此外，施放特殊元素战技柔板·破晓终奏后，在独舞倒影剩余持续时间内，若奥黛塔处于辉映·星烁状态，则独舞倒影的两种舞步还会额外造成视为对应星烁反应伤害的冰元素范围伤害。
- id: 11500003
  name: 华彩
  text: |-
    解锁突破天赋「获选者的春祭」后，奥黛塔召唤独舞倒影时将会获得的特殊效果。
    每层华彩都会使角色造成的星烁反应伤害提升15%，持续至独舞倒影退场或重新召唤独舞倒影。
    当奥黛塔处于队伍后台时，奥黛塔每秒会清除1层华彩，并使队伍中附近的其他角色获得对应层数的华彩。
- id: 11500004
  name: 辉映·星烁
  text: |-
    辉映·星超导与辉映·星扩散统称为辉映·星烁状态。
    角色同时只能受到一种辉映状态影响，且优先被辉映·星超导影响。
