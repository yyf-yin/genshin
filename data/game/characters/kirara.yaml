passives:
- name: 妖说歧尾之变
  description: 绮良良处于呜喵町飞足的猫箱急件状态下时，每次冲撞触及敌人，都将获得一层加固包装，此效果每0.5秒对每个敌人至多触发一次，至多叠加3层。猫箱急件状态结束时，每层加固包装都将为绮良良生成一个安全运输护盾，通过这种方式生成的护盾的伤害吸收量相当于呜喵町飞足生成的安全运输护盾的20%，若绮良良已处于呜喵町飞足的安全运输护盾的庇护下，剩余的伤害吸收量将叠加，并刷新持续时间。
