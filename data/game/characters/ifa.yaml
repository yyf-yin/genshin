passives:
- name: 场中医者视野
  description: 伊法处于夜魂加持状态下时，将基于队伍中所有角色当前夜魂值的总和，每1点夜魂值都将使伊法获得1点**「救援要义」**。救援要义可以提升队伍中附近的角色触发的扩散、星扩散、感电、月感电反应造成的伤害。
- name: 互助救援协议
  description: 队伍中的附近的角色触发「夜魂迸发」时，伊法的元素精通提升80点，持续10秒。
- name: 夜域赐礼·集念急救
  description: |-
    在夜魂值耗竭后，伊法将会转而消耗燃素来维持夜魂加持。
    在纳塔存在燃素机制的区域时，能够进行夜魂传递·伊法。当前场上角色位于一定高度的空中时，切换伊法登场时触发：伊法将进入夜魂加持状态，并获得32点夜魂值。自己的队伍每10秒可以触发一次夜魂传递。
- name: 温敷战术包扎
  description: 在纳塔存在燃素机制的区域时，队伍中自己的当前场上角色或受魂附的龙生命值低于40%时，伊法将消耗10点燃素为其恢复40%生命值。该效果每10秒至多触发一次，在秘境、征讨领域、深境螺旋中无效。
