  c5:
    name: 贵种的职守
    description: |-
      元素爆发**致礼·献予女皇陛下**的技能等级提高3级。
      至多提升至15级。
  c6:
    name: 不移的赤忱
    description: |-
      施放最高境界**翔风剑**后的5秒内，薇斯纳可以点按普通攻击或元素战技，施放风仙一族秘传的翔风剑·变移：造成薇斯纳150%攻击力的风元素伤害，并召唤出**灵剑**，额外造成薇斯纳200%攻击力的风元素伤害。若薇斯纳处于**巡风列装**模式，还会额外唤出风翎协同攻击敌人。
      此外，薇斯纳造成的星扩散反应伤害**擢升**20%。
terms:
- id: 11190007
  name: 擢升
  text: 特殊的伤害提升效果，与其他的伤害提升效果分别独立计算。
- id: 11430001
  name: 巡风列装
  text: |-
    施放元素战技操典·制胜有道后，薇斯纳将切换至该模式。该模式至多持续15秒，并具有如下特性：
    ·提升薇斯纳的抗打断能力。
    ·薇斯纳进行普通攻击、重击与下落攻击时，将转为造成无法被附魔覆盖的风元素伤害，并唤出风翎协同攻击敌人，造成额外的风元素伤害；每次唤出风翎时，都会为薇斯纳恢复一定的剑气。
    ·薇斯纳可以消耗剑气，施放特殊的元素战技翔风剑，对敌人造成风元素伤害。
    ·持续时间结束时，或施放三次最高境界的翔风剑后，薇斯纳将退出该模式，并清除所有剑气。
- id: 11430002
  name: 剑气
  text: |-
    用于在巡风列装模式下施放特殊元素战技翔风剑的能量。
    薇斯纳可以通过以下方式积攒剑气：
    ·在巡风列装模式下，进行普通攻击、重击、下落攻击，或施放命之座「不移的赤忱」中的翔风剑·变移；
    ·施放元素战技操典·制胜有道；
    ·施放元素爆发致礼·献予女皇陛下。
- id: 11430003
  name: 翔风剑
  text: |-
    在巡风列装模式下，薇斯纳可以消耗剑气，施放该特殊元素战技，造成风元素伤害。
    每次施放特殊元素战技翔风剑后，本次巡风列装模式持续期间，其境界都会提升；翔风剑的初始境界为一阶，至多提升至三阶。
    施放境界提升后的翔风剑时，还会唤出灵剑，对敌人造成风元素伤害。
- id: 11430004
  name: 灵剑
  text: |-
    薇斯纳召唤出的灵体武器，会协同薇斯纳对敌人进行攻击，造成风元素伤害。
    薇斯纳可以通过以下方式召唤出灵剑：
    ·施放境界提升的特殊元素战技翔风剑；
    ·施放元素爆发致礼·献予女皇陛下；
    ·施放命之座「不移的赤忱」中的翔风剑·变移。

    辉映·星扩散：灵剑转为造成视为星扩散反应伤害的风元素伤害。
