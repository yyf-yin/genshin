intro: |-
  薇斯纳是一位可以使队伍中的角色能触发星扩散反应，并直接造成星扩散反应伤害的风元素输出型角色。
  施放元素战技，薇斯纳会切换至巡风列装模式，进行普通攻击、重击与下落攻击时，会唤出风翎协同攻击敌人，并为薇斯纳恢复「剑气」；薇斯纳可以消耗剑气，使出每次施放都会比上次更强的特殊元素战技「翔风剑」。
  施放元素爆发，薇斯纳会驱动灵剑，对敌人造成风元素范围伤害，并恢复剑气。
  处于辉映·星扩散状态时，薇斯纳的所有灵剑都会对敌人造成视为星扩散反应伤害的风元素伤害。
