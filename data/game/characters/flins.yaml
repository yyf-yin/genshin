intro: |-
  菲林斯是一位可以使队伍中的角色能触发月感电反应，并可以通过技能直接造成月感电反应伤害的雷元素输出型角色。
  菲林斯施放元素战技后，会进入特殊的「幽焰显迹」模式，普通攻击与重击将转为无法被附魔覆盖的雷元素伤害，并且可以施放特殊的元素战技。
  施放特殊元素战技后的一段时间内，菲林斯可以施放特殊的元素爆发。菲林斯的元素爆发与特殊元素爆发均可对敌人直接造成月感电反应伤害。
