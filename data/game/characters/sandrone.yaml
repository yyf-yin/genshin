intro: |-
  桑多涅是一位可以使队伍中的角色能触发星超导反应，并可以通过技能直接造成星超导反应伤害的冰元素输出型角色。
  进行重击时，桑多涅将会召唤自动机关「法洁欧」轰击敌人。期间，法洁欧的功率会不断上升；上升至最大值后，法洁欧将会因为过热而导致攻击频率降低。
  施放元素战技时，桑多涅会对附近的敌人发射棱晶弹，并降低法洁欧的功率值，使其可以继续对敌人进行强力轰炸。
  施放元素爆发时，桑多涅会召唤出大量棱晶谐振炮，优雅地对前方进行广域轰炸。
