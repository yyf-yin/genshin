passives:
- name: 月下素娥降仙
  description: 施放元素战技**天地忽然身**时，或队伍中附近的角色触发月笼谐奏时，兹白将获得持续4秒的「太阴降」效果：**灵驹飞踏**第二段攻击造成的伤害提升，提升值相当于兹白防御力的60%。
- name: 叠嶂峦岫出云
  description: 队伍中每存在一名元素类型为岩元素的其他角色，都会使兹白的防御力提升15%；队伍中每存在一名元素类型为水元素的其他角色，都会使兹白的元素精通提升60点。
- name: 月兆祝赐·浮明若流
  description: |-
    队伍中的角色触发水元素结晶反应时，将转为触发月结晶反应，且基于兹白的防御力，提升队伍中角色造成的月结晶反应的基础伤害：每100点防御力都将提升0.7%月结晶反应的基础伤害，至多通过这种方式提升14%伤害。

    此外，兹白在队伍中时，队伍的月兆将会上升一级。
- name: 花林如霰
  description: |-
    在夜间（18时至6时），不处于战斗状态下时，每2秒为兹白恢复1点元素能量。
    该效果在秘境、征讨领域、深境螺旋中无效。
