    description: 处于**「月转时隙」**模式下时，兹白的普通攻击连击段数不会重置，且灵驹飞踏命中敌人时，兹白将获得「月涣华」效果：下一次进行普通攻击时，第四段额外攻击将造成相当于原本250%的月结晶反应伤害。
