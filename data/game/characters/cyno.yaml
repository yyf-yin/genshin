upgrades:
- slot: 元素战技
  name: 秘仪·律渊渡魂
  description: |-
    疾速突进，对路径上的敌人造成雷元素伤害。

    当赛诺处于「启途誓使」状态下时，将转而施展冥祭，释放惊雷的力量，造成雷元素范围伤害。若赛诺通过施放元素爆发圣仪·煟煌随狼行进入启途誓使状态，施展冥祭时，还会延长本次启途誓使状态的持续时间。

    <i>「这场审判，你无权选择接受或拒绝。你与我…都早已置身其中了。」</i>
- slot: 固有天赋
  name: 落羽的裁择
  description: |-
    在启途誓使状态下时，赛诺将间歇性处于「末途真眼」状态下。在该状态期间施放秘仪·律渊渡魂时，将触发「裁定」效果，使此次秘仪·律渊渡魂造成的伤害提升35%，并向前方发射3道渡荒之雷，造成等同于赛诺攻击力100%的雷元素伤害。渡荒之雷造成的伤害视为元素战技伤害。

    辉映·星超导：触发裁定效果时，会转为向前方发射3道渡荒之雷·星偕，造成等同于赛诺攻击力200%的雷元素伤害，该伤害视为星超导反应造成的伤害。
- slot: 固有天赋
  name: 九弓的执命
  description: |-
    基于赛诺的元素精通，提高自身以下攻击造成的伤害值：
    ·启途誓使状态下的普通攻击：元素精通的150%；
    ·突破天赋「落羽的裁择」的渡荒之雷：元素精通的250%。
    ·突破天赋「落羽的裁择」的渡荒之雷·星偕：元素精通的600%。
- slot: 任务解锁天赋
  name: 启途的伴星
  description: |-
    不处于启途誓使状态下时，施放元素战技秘仪·律渊渡魂后，赛诺将会短暂进入启途誓使状态，持续6秒。
    此外，处于极星辉域中时，赛诺将会进入辉映·星超导状态。
- slot: c1
  name: 立仪·俯览昼冥
  description: |-
    施放圣仪·煟煌随狼行后，赛诺普通攻击的攻击速度提升20%，持续10秒。若施放秘仪·律渊渡魂时触发了突破天赋「落羽的裁择」的「裁定」效果，将刷新该效果的持续时间。
    需要解锁突破天赋「落羽的裁择」。

    辉映·星超导：进入启途誓使状态时，还会额外获得偕日共升效果：元素精通提升200点。持续期间，赛诺在当前场上切换角色时，下一名登场角色将会继承偕日共升效果与其剩余持续时间。
- slot: c2
  name: 令仪·引谒归灵
  description: |-
    赛诺的普通攻击命中敌人后，雷元素伤害加成提升10%，持续4秒。该效果每0.1秒至多触发一次，至多叠加5层。

    此外，处于偕日共升效果影响下的角色的普通攻击与重击命中敌人时，该角色造成的星超导反应伤害提升16%，该效果持续至偕日共升效果结束，每0.1秒至多触发一次，至多叠加5层。
- slot: c4
  name: 巡仪·蒇护禁罔
  description: |-
    赛诺处于圣仪·煟煌随狼行的启途誓使状态下时，触发感电、月感电、超导、星超导、超载、原激化、超激化、超绽放、雷元素扩散反应后，将为队伍中附近的所有角色（除了赛诺自己）恢复3点元素能量。该效果在一次圣仪·煟煌随狼行中，至多触发5次。

    处于偕日共升效果影响下的其他角色触发上述反应后，还会为赛诺恢复20点元素能量，该效果每18秒至多触发一次。
- slot: c6
  name: 羽仪·裁落钧衡
  description: |-
    施放圣仪·煟煌随狼行或触发突破天赋「落羽的裁择」的「裁定」后，赛诺将获得4层「豺祭」效果。赛诺的普通攻击命中敌人时，将消耗一层「豺祭」效果，并发射一道渡荒之雷。若赛诺处于偕日共升效果影响下，将转为发射一道渡荒之雷·星偕。
    「豺祭」持续8秒，单次「启途誓使」状态至多叠加8层，并将在圣仪·煟煌随狼行的启途誓使状态结束后移除。
    每0.4秒至多通过这种方式发射一道渡荒之雷或渡荒之雷·星偕。
    需要解锁突破天赋「落羽的裁择」。
