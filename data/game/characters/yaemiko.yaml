upgrades:
- slot: 元素爆发
  name: 大密法·天狐显真
  description: |-
    稻妻民话中有「狐凭」一说。其中比较特殊的「天狐之凭」会以雷霆的形式降临在鸣神大社的敌人身上。降下雷电，造成雷元素范围伤害。
    施放时，八重神子会凭依附近的杀生樱，化作天狐霆雷降下，造成雷元素范围伤害。附近每存在一株杀生樱，就能降下一道天狐霆雷。

    <i>八重仅在此时需要露出天狐之凭证，号令雷霆。而看过宫司大人露出尾巴的家伙，都已经灰都不剩了。因此，谨记于心——八重大人是没有尾巴的。</i>
- slot: 固有天赋
  name: 神篱之御荫
  description: |-
    施放大密法·天狐显真时，每凭依一株杀生樱，就会重置一次野干役咒·杀生樱的冷却时间。
    附近同时存在至少3株杀生樱时，施放野干役咒·杀生樱时，八重神子还会额外引发一次雷击，造成相当于八重神子40%攻击力的雷元素伤害。
    辉映·星超导：上述额外雷击转为造成一次视为星超导反应伤害的雷元素伤害，伤害相当于八重神子50%攻击力。
- slot: 任务解锁天赋
  name: 祓所之讬宣
  description: |-
    杀生樱的持续时间延长10秒。队伍中附近的角色触发超导或星超导反应后，下一次杀生樱的落雷将得到强化：提升造成的伤害，提升值相当于八重神子攻击力的80%，该效果每2.5秒至多触发一次。
    辉映·星超导：受到上述效果强化的落雷命中敌人后，还会额外造成一次相当于八重神子攻击力200%的雷元素伤害，该伤害被视为星超导反应伤害。
    此外，处于极星辉域中时，八重神子将会进入辉映·星超导状态。
- slot: c1
  name: 野狐供真篇
  description: 大密法·天狐显真每引发一次天狐霆雷，都会为八重神子自己恢复8点元素能量；八重神子触发超导/星超导反应或造成星超导反应伤害后，队伍中附近角色获得50%雷元素伤害加成和星超导伤害加成，持续10秒，重复触发刷新持续时间。
- slot: c2
  name: 望月吼哕声
  description: 杀生樱创造时的初始位阶提升至贰阶，位阶上限提升至肆阶，攻击范围提升60%；此外，杀生樱在场时，还会根据杀生樱的位阶，使八重神子与队伍中自己的当前场上角色的元素精通提升60/90/120/200点。
- slot: c4
  name: 绯樱引雷章
  description: 杀生樱的落雷命中敌人后，队伍中附近的所有角色获得20%雷元素伤害加成，持续5秒，并为八重神子回复8点元素能量，上述恢复元素能量的效果每5秒最多触发一次；此外，八重神子的元素爆发伤害提升100%。
- slot: c6
  name: 大杀生咒禁
  description: 杀生樱在攻击时无视敌人60%的防御力，八重神子造成的星超导反应伤害的暴击伤害提升200%。
