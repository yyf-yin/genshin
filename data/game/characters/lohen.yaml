passives:
- name: 禁问的训诫
  description: 在**奇谋**状态下，队伍中附近的其他角色通过造成伤害为洛恩积攒**争胜**时，若本次伤害不低于洛恩基础攻击力的3000%，则还会为洛恩额外积攒60点争胜。
- name: 戏言的杰作
  description: 在**奇谋**状态下，队伍中附近的其他角色对敌人触发冰元素相关反应后的8秒内，该角色的攻击力提升15%，洛恩的攻击力提升15%。
- name: 兴尽且去来
  description: |-
    施放元素战技奇兵诡出后，洛恩还会获得9秒的「乘兴」效果：持续期间，元素战技奇兵诡出的技能等级提高1级。
    施放元素战技时，如果队伍中其他角色的普通攻击、元素战技或元素爆发中，任一技能等级不低于洛恩的元素战技的技能等级，则本次「乘兴」效果的持续时间额外延长6秒。
    每18秒至多获得一次「乘兴」效果。
constellations:
  c1:
    name: 往昔微风，载满悲歌
    description: |-
      洛恩的**争胜**上限提升至原来的300%。
      此外，处于**奇谋**状态下时，队伍中附近的其他角色通过造成伤害为洛恩积攒的争胜提升至原来的500%。
  c2:
    name: 凡飞翔者，皆为靶标
    description: 处于**奇谋**状态下时，特殊元素战技**镂骨彻心**命中敌人或施放元素爆发裁罚遂成后的4秒内，洛恩将获得「破邪之刃」效果：在奇谋状态下，洛恩的下一次普通攻击或重击命中敌人时，将会额外追加进行一次攻击，造成相当于洛恩攻击力500%的冰元素范围伤害，并使队伍中附近的其他角色的元素精通提升200点，持续8秒，每4秒至多获得一次「破邪之刃」效果。
  c3:
    name: 唯有锋刃，能愈此伤
    description: |-
      元素战技**奇兵诡出**的技能等级提高3级。
      至多提升至15级。
  c4:
    name: 爱若流光，逝如欢歌
    description: |-
      洛恩在**奇谋**状态下施放元素爆发裁罚遂成时，还会将洛恩的**争胜**积攒至上限，从而使本次元素爆发获得最高的伤害提升效果。

      此外，洛恩切换至奇谋状态时，若元素能量：
      ·未充满：为洛恩恢复15点元素能量；
      ·已充满：接下来的15秒内，施放元素爆发裁罚遂成后，为洛恩恢复15点元素能量。
  c5:
    name: 无可窥探，无可质疑
    description: |-
      元素爆发**裁罚遂成**的技能等级提高3级。
      至多提升至15级。
  c6:
    name: 身沦魂销，唯余欢悦
    description: |-
      施放特殊元素战技**镂骨彻心**命中敌人或在**奇谋**状态下施放元素爆发裁罚遂成不会消耗**争胜**，并会使洛恩的**欢悦**恢复至上限，且在下一次施放特殊元素战技镂骨彻心命中敌人时，使本次奇谋状态的持续时间延长1.25秒，该效果每7秒至多触发一次。
      此外，上述所有伤害的暴击伤害都将提升175%，且本次奇谋期间，洛恩施放镂骨彻心的最大次数增加2次。
