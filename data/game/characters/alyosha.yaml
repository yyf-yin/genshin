intro: |-
  阿罗夏是一位兼具后台输出能力与治疗能力的雷元素角色，施放元素爆发后，还可以召唤猎犬伙伴「图加林」一同作战。
  阿罗夏的最后一段普通攻击或元素战技命中敌人时，会为敌人施加特殊的「弋猎印记」；阿罗夏的最后一段普通攻击、元素战技或图加林的攻击命中处于「弋猎印记」影响下的敌人后的一段时间内，队伍中附近的角色在场上的攻击力将会获得提升。
  解锁固有天赋「惊醒沉睡的林线」后，图加林攻击敌人时，还会为队伍中附近的当前场上角色恢复生命值。
