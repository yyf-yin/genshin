  name: 图加林
  text: 深受阿罗夏信赖的猎犬伙伴，可以通过施放元素爆发守猎进踞召唤至场上，会间歇性快速移动至一名敌人附近，对其进行撕咬攻击，并激活已有的弋猎印记。
