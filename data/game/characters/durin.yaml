id: durin
game_id: 10000123
zh: 杜林
en: Durin
title: 「不熄灭的火」
element: pyro
weapon: sword
rarity: 5
region: 蒙德
affiliation: 魔女会
version: '6.2'
intro: |-
  杜林是一位兼具后台输出能力与辅助能力的火元素角色，依据不同的技能施放方式，可以自由选择杜林的战斗风格：注重于辅助队友，或是展现出更具攻击性的一面。
  杜林施放元素战技后，原本的普通攻击与元素战技将会分别被替换为特殊的效果；在这种情况下，点按普通攻击或元素战技后，杜林将会分别进入特殊的黑度之否或白化之是状态。
  通过上述方式点按普通攻击，杜林将会进入黑度之否状态。在这种情况下，杜林的元素爆发可以提升杜林自己触发的蒸发与融化反应造成的伤害，并间歇性对附近一名敌人进行攻击，造成火元素伤害。
  通过上述方式点按元素战技，杜林将会进入白化之是状态。在这种情况下，杜林的元素爆发可以间歇性对附近的敌人造成伤害，并可以通过触发火元素相关反应，降低敌人的火元素抗性与参与反应的对应元素抗性。
witch_quest: |-
  完成魔女的课业·此世之题后，杜林将成为魔导角色。队伍中编入至少2名魔导角色时，将获得魔导·秘仪效果，使魔导角色获得强化。

  魔导·秘仪
  除持续时间外，突破天赋「光灵遵神数显现」中的所有效果提升75%。
