intro: |-
  沃雅妮莎是一位兼具治疗与辅助能力的水元素角色，可以使队伍中角色触发的水元素、冰元素伤害与星扩散反应伤害得到强化。
  施放元素战技时，沃雅妮莎会进入「遥久之歌」状态，周期性召唤出角笛，协同当前场上角色攻击目标，降低被命中敌人的水元素与冰元素抗性，并间歇性为当前场上角色提供治疗。沃雅妮莎施放元素战技时，会获得一定层数的「领唱」与「重唱」，提升队伍中角色造成的水元素与冰元素伤害。
  此外，施放元素战技时，将使当前场上的星辉风旋转化为「流荡风旋」，且队伍中附近的角色在遥久之歌效果持续期间触发星扩散反应时，将取代星辉风旋创造流荡风旋，流荡风旋在创造和引爆时，还会降低附近敌人的风元素抗性，并使「领唱」与「重唱」可以提升队伍中角色造成的星扩散反应伤害。
  施放元素爆发，沃雅妮莎会对敌人造成水元素范围伤害。处于遥久之歌状态下时，还会进一步提升伤害。
