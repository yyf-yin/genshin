# 用途：① 纠正 AI 字幕的同音错字（三个字以上的名字按拼音自动纠；两个字的名字容易误伤，
#       例如“甘雨”和“干预”同音，要纠就写 homophone: true，或者在 typos 里写死）；
#       ② 把抽取结果里的名字归一成 id。
