# since 是角色上线日期（可选）：投票时只拿这天之后的视频给这个角色计票，更早的视频里推荐的替代队友会标“可能已过时”。
#   全部角色的上线日期和体系加强统一写在 data/releases.yaml，这里一般不用再写。

