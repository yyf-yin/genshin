# 写死的错字纠正（AI 字幕里实际见到的再往这里加）。左边错，右边对。
typos:
  万业: 万叶
  新扩散: 星扩散
  新超导: 星超导
  新反应: 星反应
  终离: 钟离

# 玩法名归一（2026-10-26 Cliff 确认）：星反应 = 星扩散 + 星超导，和常规的扩散、超导不同；
# 常规超导在当前版本基本不会出现，所以攻略里单写“超导”的按星超导算（多半是字幕漏了“星”）。常规扩散还在用（如火风扩散），不归并
playstyles:
  aliases:
    超导: 星超导
    新超导: 星超导
    新扩散: 星扩散
  parents:
    星反应: [星超导, 星扩散]   # 同一个主 C 只出现过其中一种具体玩法时，归到那一种；两种都有就保留“星反应”
