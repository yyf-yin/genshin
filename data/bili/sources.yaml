# B 站取材配置：要提取哪些角色、用什么搜索词、信任哪些 UP 主。
# since：角色正式上线日期，只取这天之后发布的视频（避免测试服爆料和旧版本攻略）。不填就不过滤。
# pilot: true 的角色是试点，`python -m genshin_assistant bili run` 不带角色名时只跑它们。

defaults:
  queries: ["{zh} 配队", "{zh} 养成 攻略", "{zh} 替代 平替", "{zh} 深渊"]
  max_videos: 8        # 每个角色最多取几个视频（方案定的是 5 到 10 个）
  # 前 recent_slots 个名额按版本分层：从最新版本往回，每个版本取一个最好的视频（版本表在 data/releases.yaml）。
  # 主 C 先出、最佳队友后几个版本才补齐（法尔伽之后的妮可），只按播放量选会全是上线期的旧攻略
  recent_slots: 4
  min_duration: 120    # 秒，短于这个的不要
  # 标题含这些词的跳过（多半不是配队养成攻略）
  # 标题、简介或标签里至少要有一个这些词，防止别的游戏同名角色混进来
  require_words: [原神]
  # 视频没有字幕时，下载音轨用本机 faster-whisper 转写：off / whitelist（只给白名单 UP 主）/ all
  # 打开前先 pip install -e ".[asr]"；asr_model 越大越准越慢（tiny/base/small/medium/large-v3）
  asr: off
  asr_model: small
  # 硬字幕（剪进画面里的字）用 OCR 读，优先于语音识别：off / whitelist / all
  # 打开前先 pip install -e ".[ocr]"（用 OpenCV 解码，不用另装 ffmpeg）
  # ocr_crop 是字幕条的位置 [上, 下, 左, 右]，占画面的比例（0 是顶 / 左）。框大了会把进度条、血量、按钮一起读进来
  ocr: whitelist     # 2026-10-26 试跑：贪欲九头蛇_ 薇斯纳那期读出 569 行，角色名都对
  ocr_crop: [0.84, 0.93, 0.15, 0.85]
  ocr_crop_up:          # 个别 UP 主字幕位置不同就在这里单独写
    贪欲九头蛇_: [0.84, 0.93, 0.15, 0.85]   # 2026-10-26 用薇斯纳那期实测：字幕在 86%-93%
  exclude_words: [幻化, 外观, 剧情, 抽卡, 抽取记录, 爆料, 测试服, 前瞻, 手书, MMD, cos, 鬼畜, 有趣, 小知识, 冷知识, 彩蛋, 代肝, 交单, 实况]

# 信任的 UP 主（名字或 mid）。白名单里的视频排在前面，草稿里也会标出来；
# 写名字的还会单独搜一次“UP 名 + 角色名”，所以名字要和 B 站上一字不差。
whitelist_up:
  - 贪欲九头蛇_
  - 卡特亚

characters:
  - id: neuvillette
    zh: 那维莱特
    aliases: [水龙, 水龙王]
    since: 2023-09-21   # 4.1 版本（首池 2023-09-27，见 data/releases.yaml）
    # 第一轮试点用过；上线多年，攻略跨版本，时效问题多，MVP 先不跑
  - id: varka
    zh: 法尔伽
    aliases: [法尔加, 大团长, 尼法]   # B 站标题写“法尔伽”；“法尔加”会误配“特拉法尔加”（碧蓝航线），靠下面的“原神”要求兜住
    since: 2026-02-19
    # 第一轮试点用过（整队限制：双风 + 双同元素）；妮可等队友后出，时效问题多，MVP 先不跑
  - id: vesna
    zh: 薇斯纳
    aliases: [微丝娜, 薇丝纳]
    since: 2026-09-17
    queries: ["{zh} 配队", "{zh} 奥黛塔", "{zh} 养成 攻略", "{zh} 替代 平替"]
    pilot: true         # 试点：功能分级（奥黛塔槽的挂冰是核心功能）
  # MVP（2026-10-26 起）：只跑最近几个版本新上线的角色。她们的攻略都在上线后几周内，不用管时效；
  # 视频里顺带讲的老角色队伍（如沃雅妮莎攻略里的绫华队、丝柯克队）往往就是那些老角色当前的最优队，
  # 抽取时按主 C 分开记。以后每出一个版本，把新角色加在这里。上线日期见 data/releases.yaml（月之八以后是推算的）
  # 新辅助的攻略最有用：主 C 在队里位置固定，能让老队伍变强的只有新辅助，她的攻略会给出各个主 C 带上她之后的最优队。
  # 跑完用 `bili cores` 按主 C 汇总
  - id: woyanisha
    zh: 沃雅妮莎
    since: 2026-09-17   # 7.1
    queries: ["{zh} 配队", "{zh} 养成 攻略", "{zh} 绫华", "{zh} 丝柯克"]
    pilot: true         # 辅助：星扩散之外也补强水冰（绫华、丝柯克）
  - id: odette
    zh: 奥黛塔
    since: 2026-08-06   # 7.0
    pilot: true
  - id: aluoxia
