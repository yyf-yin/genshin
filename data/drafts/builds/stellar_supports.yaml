# 星烁队常用队友的配装草稿，引擎不读（这些角色还在 drafts/characters/，审核后连同角色标签一起挪进 builds/）。
# 角色 id 用游戏数据的 id（drafts/characters/ 也是）。
# 来源分两类，逐项标出：
#   [攻略] 桑多涅/奥黛塔/阿罗夏/薇斯纳/沃雅妮莎的攻略视频里讲到的，多半只有 1 个视频，审核时优先看；
#   [常识] 视频没讲、按这些老角色的通用配装补的（AI 补全，未按攻略核对）。
# 星烁反应伤害吃攻击力、不吃元素伤害加成，所以星烁队里一些辅助改带攻击杯（七七、八重神子）。
