[project]
name = "genshin-assistant"
version = "0.1.0"
description = "原神配队与养成推荐引擎"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pypinyin>=0.50"]
bili = ["pypinyin>=0.50"]  # AI 字幕同音错字纠正

[project.scripts]
genshin-assistant = "genshin_assistant.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
